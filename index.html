<!DOCTYPE html>
<html lang="zh-CN" data-theme="eye">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EDDF">
<meta name="color-scheme" content="light dark">
<title>数学闯关岛 · 初中数学练习</title>
<script>
/* 首帧前应用主题，避免闪烁 */
(function(){var t='eye';try{t=localStorage.getItem('mathquest_theme')||'eye';}catch(e){}
var r=document.documentElement;r.setAttribute('data-theme',t);
var dark=t==='dark'||(t==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#1F1F1C':'#F3EDDF');})();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" onerror="this.remove()">
<style>
/* ===== 主题变量：默认「护眼」（暖纸色） ===== */
:root{
  color-scheme: light;
  --bg:#F3EDDF; --card:#FAF6EC; --card2:#F0E9D9; --track:#E6DECB; --line:#E3DAC6;
  --ink:#3A3A33; --sub:#625D51; --faint:#9C9585;
  --pri:#4A7563; --pri2:#6E9584; --pri-soft:#E1E8DA; --pri-ink:#3C6455; --on-pri:#FBF8F0;
  --ok:#4C7A49; --ok-soft:#E2EAD3; --ok-ink:#3D6A3B; --ok-line:#B9CDA8;
  --bad:#A55545; --bad-soft:#F2E1D7; --bad-ink:#94473A; --bad-line:#DDB5A6;
  --warn:#8F6526; --warn-soft:#F2E5CA; --warn-ink:#83591D; --warn-line:#DCC191;
  --gold:#C29A35; --lav:#7D7299; --lav-soft:#E8E3EC; --sky:#5B7F92; --sky-soft:#DFE7E8;
  --hero:#E7DEC9; --hero-ink:#3A3A33; --stat:#F5EFE1;
  --h0:#E8E1CF; --h1:#D1DCC2; --h2:#ABC29D; --h3:#81A277; --h4:#5D8058;
  --toast-bg:#3D3B33; --toast-ink:#F3EDDF; --mask:rgba(45,40,28,.42);
  --tabbar:rgba(247,242,231,.96);
  --shadow:0 2px 10px rgba(92,78,45,.08); --shadow-btn:0 2px 6px rgba(78,122,105,.18);
  --confetti:#6E9584,#B98637,#B4614F,#7D7299,#5B7F92,#C29A35,#8FAE7E;
  --r:20px; --tabh:64px;
}
/* ===== 深色 ===== */
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#1F1F1C; --card:#2A2925; --card2:#33322D; --track:#3A3933; --line:#3B3A34;
  --ink:#D8D4C8; --sub:#A39E91; --faint:#7A766B;
  --pri:#86AE9B; --pri2:#6F9886; --pri-soft:#2F3B34; --pri-ink:#A9C8B8; --on-pri:#1C1E1A;
  --ok:#86B080; --ok-soft:#2B3628; --ok-ink:#A9CDA2; --ok-line:#4D6647;
  --bad:#D28C7B; --bad-soft:#3D2B26; --bad-ink:#E7AA9A; --bad-line:#6E463D;
  --warn:#D2A762; --warn-soft:#3A3123; --warn-ink:#E3C089; --warn-line:#6A5634;
  --gold:#D3B45E; --lav:#A79CC4; --lav-soft:#322F3A; --sky:#8DB0C2; --sky-soft:#29333A;
  --hero:#2E2D28; --hero-ink:#D8D4C8; --stat:#373630;
  --h0:#33322D; --h1:#3A4A39; --h2:#4E6A4A; --h3:#6A8E64; --h4:#8CB085;
  --toast-bg:#D8D4C8; --toast-ink:#1F1F1C; --mask:rgba(0,0,0,.55);
  --tabbar:rgba(36,35,32,.96);
  --shadow:0 2px 10px rgba(0,0,0,.28); --shadow-btn:none;
  --confetti:#86AE9B,#D2A762,#D28C7B,#A79CC4,#8DB0C2,#D3B45E,#9DBF8D;
}
@media (prefers-color-scheme: dark){
:root[data-theme="system"]{
  color-scheme: dark;
  --bg:#1F1F1C; --card:#2A2925; --card2:#33322D; --track:#3A3933; --line:#3B3A34;
  --ink:#D8D4C8; --sub:#A39E91; --faint:#7A766B;
  --pri:#86AE9B; --pri2:#6F9886; --pri-soft:#2F3B34; --pri-ink:#A9C8B8; --on-pri:#1C1E1A;
  --ok:#86B080; --ok-soft:#2B3628; --ok-ink:#A9CDA2; --ok-line:#4D6647;
  --bad:#D28C7B; --bad-soft:#3D2B26; --bad-ink:#E7AA9A; --bad-line:#6E463D;
  --warn:#D2A762; --warn-soft:#3A3123; --warn-ink:#E3C089; --warn-line:#6A5634;
  --gold:#D3B45E; --lav:#A79CC4; --lav-soft:#322F3A; --sky:#8DB0C2; --sky-soft:#29333A;
  --hero:#2E2D28; --hero-ink:#D8D4C8; --stat:#373630;
  --h0:#33322D; --h1:#3A4A39; --h2:#4E6A4A; --h3:#6A8E64; --h4:#8CB085;
  --toast-bg:#D8D4C8; --toast-ink:#1F1F1C; --mask:rgba(0,0,0,.55);
  --tabbar:rgba(36,35,32,.96);
  --shadow:0 2px 10px rgba(0,0,0,.28); --shadow-btn:none;
  --confetti:#86AE9B,#D2A762,#D28C7B,#A79CC4,#8DB0C2,#D3B45E,#9DBF8D;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;font-size:16px;line-height:1.6;min-height:100vh;transition:background-color .25s,color .25s}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom));position:relative}
.topbar{display:flex;align-items:center;gap:10px;padding:18px 2px 10px}
.topbar h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.5px}
.topbar .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.card.tint-warn{background:var(--warn-soft);border-color:var(--warn-line)}
.card.tint-pri{background:var(--pri-soft);border-color:transparent}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;background:var(--pri);color:var(--on-pri);box-shadow:var(--shadow-btn);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--pri-soft);color:var(--pri-ink);box-shadow:none}
.btn.ok{background:var(--ok);color:var(--on-pri)}
.btn.warn{background:var(--warn);color:var(--on-pri);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad-ink);box-shadow:none}
.btn.white{background:var(--card);color:var(--pri-ink);box-shadow:none;border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.btn.sm{min-height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--pri-soft);color:var(--pri-ink);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok-ink)}.chip.bad{background:var(--bad-soft);color:var(--bad-ink)}.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}.chip.gray{background:var(--card2);color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:18px;margin-top:14px;position:relative;overflow:hidden;border:1px solid var(--line)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--pri);opacity:.07}
.hero.warm:after{background:var(--warn);opacity:.1}
.hero .greet{font-size:14px;color:var(--sub)}
.hero .name{font-size:24px;font-weight:800;margin:2px 0 12px}
.hero .note{font-size:13px;color:var(--sub);position:relative;z-index:1}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.stat{background:var(--stat);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2;color:var(--pri-ink)}
.stat span{font-size:12px;color:var(--sub)}
.goalwrap{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px}
.ring .lbl small{display:block;font-size:11px;color:var(--sub);font-weight:600}
.goalitem{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.goalitem .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--card2)}
.goalitem .dot.done{background:var(--ok);color:var(--on-pri)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qcard{border-radius:20px;padding:14px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:1px solid var(--line);color:var(--ink)}
.qcard .big{font-size:28px;font-weight:800;line-height:1}
.qcard .t{font-weight:700}
.qcard .s{font-size:12px;color:var(--sub)}
.g1{background:var(--warn-soft)}.g1 .big{color:var(--warn-ink)}
.g2{background:var(--ok-soft)}
.g3{background:var(--lav-soft)}
.g4{background:var(--sky-soft)}
.checkin{display:flex;align-items:center;gap:12px}
.flame{font-size:34px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.today{outline:2px solid var(--warn);outline-offset:1px}
.heat i.fut{background:transparent}
.legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub);justify-content:flex-end;margin-top:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .l0{background:var(--h0)}.legend .l1{background:var(--h1)}.legend .l2{background:var(--h2)}.legend .l3{background:var(--h3)}.legend .l4{background:var(--h4)}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.item .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--pri-soft)}
.item .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.packcard{display:block;width:100%;text-align:left}
.packic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--pri-soft);flex:none}
.packic.alt{background:var(--ok-soft)}
.prog{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.prog > i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.qrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin:10px 0;border:1px solid var(--line)}
.qnum{width:36px;height:36px;border-radius:12px;background:var(--pri-soft);color:var(--pri-ink);display:grid;place-items:center;font-weight:800;flex:none}
.qrow .txt{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.stars .off{color:var(--track)}
.playhead{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
/* 固定原题：position:sticky 跟随页面滚动（iOS Safari 最稳定，不用内部滚动容器，避免抖动和键盘问题） */
.pin{position:-webkit-sticky;position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -16px;padding:env(safe-area-inset-top) 16px 8px;box-shadow:0 10px 10px -10px var(--pin-shadow,rgba(60,50,30,.28))}
.pin .orig{margin:4px 0 0;padding:12px 14px}
.ohead{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.pintgl{flex:none;font-size:13px;font-weight:700;color:var(--pri-ink);background:var(--card2);border-radius:99px;padding:5px 11px;min-height:32px;border:1px solid var(--line)}
.obody{max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.obody .katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden}
.pin.collapsed .obody{max-height:3.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pin.short .pintgl{display:none}.pin.short.collapsed .obody{max-height:none;display:block;overflow:visible}
.markcard{padding:4px 14px 12px}.markcard .markrow{border-top:0;margin-top:6px}
html[data-theme=dark] .pin{--pin-shadow:rgba(0,0,0,.6)}
@media (min-width:700px){body.inplay #app,body.inplay .tabbar .in{max-width:720px}}
/* iPad 横屏：左边原题、右边步骤 */
@media (min-width:1000px) and (orientation:landscape){
  body.inplay #app,body.inplay .tabbar .in{max-width:1120px}
  .playgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:22px;align-items:start}
  .pin{margin:0;padding:env(safe-area-inset-top) 0 8px;box-shadow:none;max-height:calc(100vh - var(--tabh) - env(safe-area-inset-bottom));max-height:calc(100dvh - var(--tabh) - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
  .obody,.pin.collapsed .obody{max-height:none;overflow:visible;display:block}
  .pintgl{display:none}
  .stepspane{padding-top:calc(14px + env(safe-area-inset-top))}
}
.timer{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-variant-numeric:tabular-nums;font-size:16px;border:1px solid var(--line)}
.timer.low{color:var(--warn-ink);background:var(--warn-soft);border-color:var(--warn-line)}
.timer.over{background:var(--bad);color:var(--on-pri);border-color:var(--bad);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.tbar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;margin:4px 0 2px}
.tbar i{display:block;height:100%;background:var(--ok);transition:width .25s linear}
.tbar.low i{background:var(--warn)}
.tbar.over i{background:var(--bad)}
.orig{font-size:16.5px;line-height:1.85}
.orig .lab{font-size:12px;font-weight:800;color:var(--pri-ink);letter-spacing:1px}
.stepdots{display:flex;gap:6px;margin:6px 0}
.stepdots i{flex:1;height:8px;border-radius:99px;background:var(--track)}
.stepdots i.cur{background:var(--pri)}
.stepdots i.first,.stepdots i.second{background:var(--ok)}
.stepdots i.missed{background:var(--bad)}
.donestep{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--card);margin:8px 0;font-size:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.donestep .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--on-pri);font-size:13px;flex:none;margin-top:1px}
.donestep .b.ok{background:var(--ok)}.donestep .b.bad{background:var(--bad)}
.stepcard{border:2px solid var(--pri-soft)}
.steplab{display:inline-block;background:var(--pri);color:var(--on-pri);border-radius:10px;padding:2px 10px;font-size:12.5px;font-weight:800;margin-bottom:8px}
.prompt{font-size:17px;font-weight:600;line-height:1.75;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border-radius:16px;background:var(--card2);border:2px solid transparent;text-align:left;font-size:16px;transition:all .12s}
.opt .k{width:30px;height:30px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-weight:800;color:var(--pri-ink);flex:none}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans{width:100%;min-height:56px;border-radius:16px;border:2px solid var(--line);padding:0 16px;font-size:20px;font-weight:700;background:var(--card2);outline:none}
.ans:focus{border-color:var(--pri);background:var(--card)}
.ans::placeholder{color:var(--faint);font-weight:500;font-size:16px}
.keys{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.keys button{min-width:46px;height:40px;border-radius:12px;background:var(--card2);font-weight:800;font-size:17px;border:1px solid var(--line)}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:15px;border:1px solid transparent}
.fb.ok{background:var(--ok-soft);border-color:var(--ok-line)}.fb.bad{background:var(--bad-soft);border-color:var(--bad-line)}.fb.hint{background:var(--warn-soft);border-color:var(--warn-line)}.fb.exp{background:var(--sky-soft)}
.fb b.t{display:block;margin-bottom:4px}
.fb.ok b.t{color:var(--ok-ink)}.fb.bad b.t{color:var(--bad-ink)}.fb.hint b.t{color:var(--warn-ink)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.95);opacity:.5}100%{transform:scale(1);opacity:1}}
.result{text-align:center}
.result .bigstars{font-size:44px;letter-spacing:6px;margin:6px 0}
.result .bigstars .off{filter:grayscale(1);opacity:.25}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:var(--card2);border-radius:14px;padding:10px 4px}
.kv b{display:block;font-size:20px}
.kv b.ok{color:var(--ok-ink)}.kv b.bad{color:var(--bad-ink)}
.kv span{font-size:12px;color:var(--sub)}
.formula{background:var(--card2);border-radius:14px;padding:10px 12px;margin:8px 0}
.bar{margin:10px 0}
.bar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .prog i.lo{background:var(--bad)}
.bar .prog i.mid{background:var(--warn)}
.bar .prog i.hi{background:var(--ok)}
.weakpill{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--warn-soft);border:1px solid var(--warn-line);margin:8px 0}
.weakpill .n{width:30px;height:30px;border-radius:10px;background:var(--warn);color:var(--on-pri);display:grid;place-items:center;font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--card2);border:1px solid transparent}
.badge .e{font-size:30px}
.badge .n{font-weight:700;font-size:13px}
.badge .d{font-size:11px;color:var(--sub)}
.badge.lock .e{filter:grayscale(1);opacity:.3}
.badge.lock .n{color:var(--sub)}
.badge.got{background:var(--warn-soft);border-color:var(--warn-line)}
.fgrid{display:grid;grid-template-columns:1fr;gap:12px}
.flip{perspective:1000px;height:190px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:auto;border:1px solid var(--line)}
.flip .f{background:var(--pri-soft);color:var(--ink);justify-content:center;align-items:center;text-align:center;border-left:6px solid var(--pri)}
.flip .f.m{background:var(--warn-soft);border-left-color:var(--warn)}
.flip .f .nm{font-size:21px;font-weight:800;margin:8px 0;color:var(--pri-ink)}
.flip .f.m .nm{color:var(--warn-ink)}
.flip .f .tap{font-size:12px;color:var(--sub)}
.flip .f .chip{background:var(--card);color:var(--sub)}
.flip .f .chip.hot{background:var(--bad-soft);color:var(--bad-ink)}
.flip .bk{background:var(--card);transform:rotateY(180deg);justify-content:center}
.flip .bk .ltx{font-size:20px;text-align:center;margin:6px 0 10px;overflow-x:auto}
.flip .bk .ttl{font-weight:800;color:var(--pri-ink)}
.flip .bk .ttl.m{color:var(--warn-ink);margin-bottom:6px}
.seg{display:flex;background:var(--track);border-radius:14px;padding:4px;gap:4px;margin:6px 0 10px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:700;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--pri-ink);box-shadow:var(--shadow)}
.filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);font-size:14px;font-weight:600;border:1px solid var(--line);color:var(--sub)}
.filter button.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--tabbar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:var(--sub);font-weight:600;position:relative}
.tabbar button .e{font-size:22px;filter:grayscale(1);opacity:.55;transition:all .15s}
.tabbar button.on{color:var(--pri-ink)}
.tabbar button.on .e{filter:saturate(.75);opacity:1;transform:translateY(-2px) scale(1.06)}
.tabbar .badge-n{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:var(--on-pri);font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:800}
.mask{position:fixed;inset:0;background:var(--mask);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s}
@media(min-width:600px){.mask{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:0 0 10px;font-size:20px}
textarea.code{width:100%;min-height:180px;border-radius:14px;border:2px solid var(--line);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--card2);outline:none}
textarea.code:focus{border-color:var(--pri)}
.field{margin:12px 0}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);padding:0 14px;background:var(--card2);outline:none}
.field input:focus{border-color:var(--pri)}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:48px}
input[type=checkbox]{accent-color:var(--pri)}
.err{color:var(--bad-ink)}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:var(--toast-bg);color:var(--toast-ink);padding:12px 18px;border-radius:16px;z-index:60;font-weight:600;font-size:15px;max-width:90vw;text-align:center;transition:transform .3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 6px 20px rgba(0,0,0,.18)}
#toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:26px 10px;color:var(--sub)}
.empty .e{font-size:44px}
.mathfb{font-family:"Times New Roman",serif;font-style:italic}
.katex{font-size:1.08em;color:inherit}
.sec-title{font-size:15px;font-weight:800;color:var(--sub);margin:22px 4px 4px;letter-spacing:.5px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--warn-soft);color:var(--warn-ink);font-weight:700;margin:10px 0;width:100%;text-align:left;border:1px solid var(--warn-line)}
a{color:var(--pri-ink)}
details summary{color:var(--ink)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mnum{width:52px;height:52px;border-radius:16px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-weight:800;line-height:1.1;border:2px solid transparent}
.mnum span{font-size:13px}.mnum i{font-style:normal;font-size:17px}
.mnum.ok{background:var(--ok-soft);border-color:var(--ok-line)}.mnum.bad{background:var(--bad-soft);border-color:var(--bad-line)}.mnum.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.mprev{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mseg{display:flex;gap:4px;flex:none}
.mseg button{width:40px;height:44px;border-radius:12px;background:var(--card2);font-size:17px;filter:grayscale(.9);opacity:.5;border:2px solid transparent}
.mseg button.on{filter:saturate(.8);opacity:1}.mseg button.on.ok{background:var(--ok-soft);border-color:var(--ok)}.mseg button.on.bad{background:var(--bad-soft);border-color:var(--bad)}.mseg button.on.warn{background:var(--warn-soft);border-color:var(--warn)}
.markrow{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}
.mpill{padding:6px 10px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:700;color:var(--sub);border:2px solid transparent;min-height:36px}
.mpill.on.ok{background:var(--ok-soft);color:var(--ok-ink);border-color:var(--ok)}.mpill.on.bad{background:var(--bad-soft);color:var(--bad-ink);border-color:var(--bad)}.mpill.on.warn{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn)}
.themeseg button{min-height:46px}
.spk{width:36px;height:36px;border-radius:12px;background:var(--pri-soft);color:var(--pri-ink);display:inline-grid;place-items:center;font-size:16px;flex:none;border:1px solid transparent}
.spk:active{transform:scale(.94)}
.spk.sm{width:30px;height:30px;border-radius:10px;font-size:14px;background:var(--card)}
.fb .spk{width:30px;height:30px;font-size:14px;background:var(--card)}
.remind{display:flex;align-items:center;gap:8px;margin:8px 0 2px;padding:10px 12px;border-radius:16px;background:var(--ok-soft);border:1px solid var(--ok-line);color:var(--ok-ink);font-size:14.5px;font-weight:600;line-height:1.5}
.remind .ri{font-size:18px}
.remind .rx{width:28px;height:28px;border-radius:9px;color:var(--sub);font-size:18px;flex:none}
#speakbar{white-space:nowrap;position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-12px);opacity:0;pointer-events:none;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:99px;background:var(--toast-bg);color:var(--toast-ink);font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:all .2s}
/* 做题页：朗读状态放进固定标题栏（计时器旁），不遮挡原题 */
body.inplay #speakbar{display:none}
.hushpill{display:none;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;background:var(--toast-bg);color:var(--toast-ink);font-size:13.5px;font-weight:700;flex:none}
body.inplay.speaking .hushpill{display:inline-flex}
.hushpill .wave{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
.hushpill .wave i{width:3px;background:currentColor;border-radius:2px;animation:wv 1s infinite ease-in-out;opacity:.8}
.hushpill .wave i:nth-child(2){animation-delay:.15s}.hushpill .wave i:nth-child(3){animation-delay:.3s}
#speakbar.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#speakbar .wave{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
#speakbar .wave i{width:3px;background:currentColor;border-radius:2px;animation:wv 1s infinite ease-in-out;opacity:.8}
#speakbar .wave i:nth-child(2){animation-delay:.15s}#speakbar .wave i:nth-child(3){animation-delay:.3s}
@keyframes wv{0%,100%{height:4px}50%{height:14px}}
#speakbar button{min-height:34px;padding:0 12px;border-radius:99px;background:var(--bg);color:var(--ink);font-weight:700;font-size:13.5px}
.tgl{width:52px;height:30px;border-radius:99px;background:var(--track);position:relative;flex:none;transition:background .2s;border:1px solid var(--line)}
.tgl i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.tgl.on{background:var(--pri);border-color:var(--pri)}
.tgl.on i{left:24px}
.switch{gap:12px;padding:4px 0}
/* 深色下 emoji 稍微降低亮度 */
:root[data-theme="dark"] .qcard .big,:root[data-theme="dark"] .flame,:root[data-theme="dark"] .badge.got .e{filter:brightness(.88)}
</style>

/* ========== 答案判定（容错） ========== */
function toHalf(s){ return s.replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\u3000/g,' '); }
function norm(s){
  s = toHalf(String(s ?? '')).trim();
  s = s.replace(/\$/g,'').replace(/\\left|\\right/g,'').replace(/\\cdot|\\times/g,'*').replace(/\\div/g,'/');
  for(let i=0;i<3;i++) s = s.replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g,'√($1)');
  s = s.replace(/[−–—﹣]/g,'-').replace(/[×✕·]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3')
       .replace(/，/g,',').replace(/。$/,'').replace(/\s+/g,'').toLowerCase();
  s = s.replace(/(\d)\*([a-z(])/g,'$1$2').replace(/\{|\}/g,'');
  return s;
}
function parseNum(raw){
  let s = norm(raw);
  if(!s) return null;
  s = s.replace(/^[a-z]{1,3}(\d)?=/,'');
  s = s.replace(/(cm|mm|km|m|kg|g|厘米|毫米|千米|米|度|°|个|元|人|天|岁)$/,'');
  let neg = false;
  if(/^-\(.*\)$/.test(s)){ neg = true; s = s.slice(1); }
  if(/^\(([^()]*)\)$/.test(s)) s = s.slice(1,-1);
  s = s.replace(/\(([^()]*)\)/g,'$1');
  const NUM = '[+-]?(?:\\d+\\.?\\d*|\\.\\d+)';
  let m, v = null;
  if((m = s.match(new RegExp('^('+NUM+')%$')))) v = parseFloat(m[1])/100;
  else if((m = s.match(new RegExp('^('+NUM+')/('+NUM+')$')))) v = parseFloat(m[1])/parseFloat(m[2]);
  else if((m = s.match(/^([+-]?\d*\.?\d*)√(\d+\.?\d*)$/))){ const c = m[1]===''||m[1]==='+'?1:m[1]==='-'?-1:parseFloat(m[1]); v = c*Math.sqrt(parseFloat(m[2])); }
  else if((m = s.match(new RegExp('^'+NUM+'$')))) v = parseFloat(s);
  if(v===null || !isFinite(v)) return null;
  return neg ? -v : v;
}
function decimals(raw){ const m = norm(raw).match(/\.(\d+)$/); return m ? m[1].length : 0; }
function numEq(user, exp){
  const a = parseNum(user), b = parseNum(exp);
  if(a===null || b===null) return false;
  if(Math.abs(a-b) <= 1e-9*Math.max(1,Math.abs(a),Math.abs(b))) return true;
  const d = decimals(user);
  if(d>=2){ const k=Math.pow(10,d); if(Math.abs(Math.round(b*k)/k-b)>1e-9 && Math.abs(a-b)<=0.5/k+1e-12) return true; } // 无限小数允许按位四舍五入
  return false;
}
function choiceIndex(step, v){
  const opts = step.options||[];
  const ok = i => (i>=0 && i<opts.length) ? i : -1;
  if(typeof v === 'number') return ok(v);
  const s = String(v ?? '').trim();
  if(/^[A-Ha-h]$/.test(s)) return ok(s.toUpperCase().charCodeAt(0)-65);
  const n = norm(s); const i = opts.findIndex(o=>norm(o)===n);
  if(i>=0) return i;
  if(/^\d+$/.test(s) && +s < opts.length) return +s;
  return -1;
}
function checkAnswer(step, input){
  const cands = [step.answer, ...(step.acceptable||[])];
  if(step.type==='choice'){ return cands.some(c=>choiceIndex(step,c)===input); }
  const u = String(input ?? '');
  if(!norm(u)) return false;
  const stripVar = s => s.replace(/^[a-z]{1,3}=/,'');
  return cands.some(c=>{
    if(numEq(u,c)) return true;
    const nu = norm(u), nc = norm(c);
    if(nu===nc || stripVar(nu)===stripVar(nc)) return true;
    return false;
  });
}
window.__mqCheck = {norm, parseNum, checkAnswer, choiceIndex, allPacks: () => allPacks()}; // 便于调试

/* ========== 题包校验与导入 ========== */
function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
function extractJSON(text){
  let t = String(text||'').trim().replace(/^\uFEFF/,'');
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) t = fence[1].trim();
  try{ return JSON.parse(t); }catch(e){
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e2){} }
    throw new Error('JSON 格式有误：'+e.message);
  }
}
function validatePack(p, idx){
  const errs = [], warns = [];
  const L = idx!=null ? `第${idx+1}个题包：` : '';
  if(!p || typeof p!=='object') throw new Error(L+'不是有效的对象');
  if(!Array.isArray(p.questions) || !p.questions.length) throw new Error(L+'缺少 questions 数组（至少 1 道题）');
  const pack = { id: String(p.id || ('pk-'+hash((p.title||'')+'|'+(p.date||'')+'|'+p.questions.length+'|'+(p.questions[0]&&p.questions[0].original||'')))),
    title: String(p.title || '未命名题包'), date: String(p.date || today()), questions: [], importedAt: Date.now() };
  const ids = new Set();
  p.questions.forEach((q,i)=>{
    const QL = `${L}第${i+1}题`;
    if(!q || typeof q!=='object'){ errs.push(QL+'格式错误'); return; }
    if(!q.original) errs.push(QL+'缺少 original（原题）');
    let id = String(q.id ?? ('q'+(i+1))); if(ids.has(id)) id = id+'_'+i; ids.add(id);
    const steps = Array.isArray(q.steps) ? q.steps : [];
    if(!steps.length) errs.push(QL+'缺少 steps（引导步骤）');
    const st = steps.map((s,j)=>{
      const SL = `${QL}第${j+1}步`;
      let type = ['choice','number','text'].includes(s.type) ? s.type : (Array.isArray(s.options)&&s.options.length ? 'choice' : 'text');
      if(s.answer===undefined || s.answer===null || s.answer==='') errs.push(SL+'缺少 answer');
      if(!s.prompt) warns.push(SL+'缺少 prompt');
      const o = {prompt:String(s.prompt||'请作答'), type, answer: s.answer, acceptable: Array.isArray(s.acceptable)?s.acceptable.map(String):[], hint:String(s.hint||'再仔细读一遍题目，想想用到了哪个知识点。'), explanation:String(s.explanation||'')};
      if(type==='choice'){
        o.options = Array.isArray(s.options) ? s.options.map(String) : [];
        if(o.options.length<2) errs.push(SL+'是选择题但 options 少于 2 个');
        else if(choiceIndex(o,o.answer)<0) errs.push(SL+'的 answer 不在 options 中（可用 "A"/"B" 或选项原文）');
      }
      if(typeof o.answer==='number') o.answer = type==='choice' ? o.answer : String(o.answer);
      return o;
    });
    const tl = +q.timeLimitSec;
    pack.questions.push({ id, original:String(q.original||''), knowledgePoints: (Array.isArray(q.knowledgePoints)&&q.knowledgePoints.length ? q.knowledgePoints : ['综合']).map(String),
      difficulty: Math.min(5,Math.max(1,Math.round(+q.difficulty||2))), timeLimitSec: tl>0 ? Math.round(tl) : 180, steps: st,
      finalAnswer: String(q.finalAnswer||''), formulas: (Array.isArray(q.formulas)?q.formulas:[]).filter(f=>f&&(f.name||f.latex)).map(f=>({name:String(f.name||'公式'),latex:String(f.latex||''),tip:String(f.tip||'')})),
      method: String(q.method||'') });
  });
  if(errs.length) throw new Error(errs.slice(0,8).join('\n')+(errs.length>8?`\n…等共 ${errs.length} 处问题`:''));
  return {pack, warns};
}
function importPacksFromText(text){
  const obj = extractJSON(text);
  let list = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.packs) ? obj.packs : [obj]);
  if(obj && obj.app==='mathquest' && obj.data) throw new Error('这是“学习进度备份”文件，请到「我的 → 数据备份」里导入。');
  const results = list.map((p,i)=>validatePack(p, list.length>1?i:null));
  let added=0, replaced=0, qn=0;
  results.forEach(({pack})=>{
    const i = D.packs.findIndex(x=>x.id===pack.id);
    if(i>=0){ D.packs[i]=pack; replaced++; } else if(isBuiltinId(pack.id)){ D.packs.push(pack); replaced++; } else { D.packs.push(pack); added++; }
    qn += pack.questions.length;
  });
  D.badges.importer = D.badges.importer || Date.now();
  save();
  return {added, replaced, qn, warns: results.flatMap(r=>r.warns), firstId: results[0].pack.id};
}

const MARKS = { ok:{e:'✅',n:'对',cls:'ok'}, wrong:{e:'❌',n:'错',cls:'bad'}, skip:{e:'⭕',n:'没做',cls:'warn'} };
const MARK_CYCLE = [null,'ok','wrong','skip'];
const isMiss = m => m==='wrong' || m==='skip';
function setMark(key, m){
  if(!findQ(key)) return;
  if(m) D.marks[key] = m; else delete D.marks[key];
  const r = D.review[key], t = today();

    else if(r.due>t){ r.due = t; r.level = 0; }
    D.hadReview = true;
  } else if(r && r.src==='mark'){ delete D.review[key]; }
  save();
}

/* ========== 统计 ========== */
function kpStats(){
  const m = {};
  D.attempts.forEach(a=>{
    (a.kps||[]).forEach(kp=>{
      const s = m[kp] || (m[kp] = {kp, att:0, steps:0, ok:0, clean:0, ot:0, time:0, pr:0, init:0});
      s.att++; s.pr++; s.steps+=a.stepsTotal; s.ok+=a.stepsOk; if(!a.missed) s.clean++; if(a.overtime) s.ot++; s.time+=a.timeUsed;
    });
  });
  Object.keys(D.marks).forEach(key=>{ // 试卷初始“错/没做”记为该知识点的一次失误
    if(!isMiss(D.marks[key])) return; const f = findQ(key); if(!f) return;
    f.q.knowledgePoints.forEach(kp=>{ const s = m[kp] || (m[kp] = {kp, att:0, steps:0, ok:0, clean:0, ot:0, time:0, pr:0, init:0}); s.att++; s.init++; s.steps += f.q.steps.length; });
  });
  return Object.values(m).map(s=>{
    s.acc = s.steps ? s.ok/s.steps : 0; s.otRate = s.att ? s.ot/s.att : 0; s.avg = s.pr ? s.time/s.pr : 0;
    s.weak = (1-s.acc) + 0.5*(1-s.clean/s.att) + 0.4*s.otRate;
    return s;
  }).sort((a,b)=>b.weak-a.weak);
}
function weakMap(){ const m={}; kpStats().forEach(s=>m[s.kp]=s.weak); return m; }
function streak(){
  let n=0, d=today();
  if(!D.checkins[d]) d = addDays(d,-1);
  while(D.checkins[d]){ n++; d = addDays(d,-1); }
  return n;
}
function bestStreak(){
  const ds = Object.keys(D.checkins).sort(); let best=0, cur=0, prev=null;
  ds.forEach(d=>{ cur = prev && dayDiff(prev,d)===1 ? cur+1 : 1; best=Math.max(best,cur); prev=d; });
  return best;
}
function goalInfo(){
  const r = dayRec(); const due = dueKeys().length;
  const rt = D.settings.goalReview ? r.reviewDone.length + due : 0;
  const nt = Math.max(0, +D.settings.goalNew||0);
  const rd = Math.min(r.reviewDone.length, rt), nd = Math.min(r.newDone.length, nt);
  const total = rt+nt; const pct = total ? (rd+nd)/total : 1;
  return {rt, nt, rd, nd, due, pct, done: total>0 && rd+nd>=total};
}
function totalStars(){ const best={}; D.attempts.forEach(a=>best[a.key]=Math.max(best[a.key]||0,a.stars)); return Object.values(best).reduce((x,y)=>x+y,0); }

function checkBadges(ctx){
  const got = [];
  const give = id => { if(!D.badges[id]){ D.badges[id]=Date.now(); got.push(id); } };
  if(D.attempts.length>=1) give('first');
  if(D.attempts.length>=10) give('ten');
  if(ctx){
    if(ctx.stars===3) give('perfect');
    if(ctx.difficulty>=4 && !ctx.missed) give('hard');
    if(!ctx.missed && ctx.timeUsed <= ctx.limit/2) give('speed');
  }
  const st = streak(); if(st>=3) give('streak3'); if(st>=7) give('streak7');
  if(D.hadReview && Object.keys(D.review).length===0) give('zero');
  if(D.points>=500) give('p500');
  if(goalInfo().done) give('goal');
  if(D.attempts.filter(a=>a.mode==='review').length>=5) give('review5');
  return got;
}

function ring(pct, size=96, stroke=10){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}">
  <circle cx="${size/2}" cy="${size/2}" r="${r}" style="stroke:var(--track)" stroke-width="${stroke}" fill="none"/>

function heatmap(weeks=16){
  const t = today(); const [y,m,d] = t.split('-').map(Number); const now = new Date(y,m-1,d);
  const dow = (now.getDay()+6)%7; // 周一=0
  const start = addDays(t, -(weeks-1)*7 - dow);
  let cells='';
  for(let i=0;i<weeks*7;i++){
    const ds = addDays(start,i);
    if(ds>t){ cells+='<i class="fut"></i>'; continue; }
    const q = (D.daily[ds]&&D.daily[ds].questions)||0; const ci = D.checkins[ds];
    const l = q>=6?4: q>=4?3: q>=2?2: (q>=1||ci)?1:0;
    cells += `<i class="l${l}${ds===t?' today':''}" title="${ds}：${q} 题${ci?' · 已打卡':''}"></i>`;
  }
  return `<div class="heat">${cells}</div><div class="legend">少 <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 多</div>`;
}

const VS = (typeof MQSpeech!=='undefined') ? MQSpeech : {supported:false, ttsSupported:false, speak(){return false;}, stop(){}, isSpeaking(){return false;}, onChange(){}, onNotice(){}, toSpeech:x=>x, voiceName(){return '';}, voices(){return [];}, addClips(){}, clipCount(){return 0;}, hasMandarin(){return false;}, whenVoices(){return Promise.resolve();}};

function remind(kind){

  const arr = REMIND[kind]; let t; do { t = pick(arr); } while(arr.length>1 && t===lastRemind[kind]);
  lastRemind[kind] = t; ss.remind = {kind, text:t, until: Date.now() + (kind==='idle'||kind==='overtime' ? 12000 : 9000)};

}

function scrollBelowPin(el, mode){
  if(!el) return;

  const r = el.getBoundingClientRect(); let dy = 0;

function updateTimer(){
  const ss = S.session; if(!ss || S.view!=='play') return;
  const f = findQ(ss.key); if(!f) return;
  const lim = f.q.timeLimitSec, used = (ss.phase==='done' ? ss.result.timeUsed : ss.elapsed/1000);
  const el = $('#timer'), tv = $('#tval'), tb = $('#tbar'); if(!el) return;
  const left = lim - used;
  if(left>=0){ tv.textContent = fmtTime(left); el.className = 'timer'+(left<=lim*0.2?' low':''); tb.className='tbar'+(left<=lim*0.2?' low':''); tb.firstElementChild.style.width = (left/lim*100)+'%'; }
  else { tv.textContent = '超时 +'+fmtTime(-left); el.className='timer over'; tb.className='tbar over'; tb.firstElementChild.style.width='100%'; }
  if(ss.phase==='done') el.classList.remove('over');
}
setInterval(()=>{ const ss = S.session; if(ss && ss.remind && ss.remind.until < Date.now()){ ss.remind = null; refreshRemind(); } }, 1000);
setInterval(()=>{
  const now = Date.now(); const dt = lastTick ? Math.min(now-lastTick, 2000) : 0; lastTick = now;
  const ss = S.session;
  if(!ss || S.view!=='play' || ss.phase==='done' || document.hidden) return;
  ss.elapsed += dt;
  const f = findQ(ss.key); if(!f) return;
  if(!ss.overtime && ss.elapsed/1000 > f.q.timeLimitSec){
    ss.overtime = true;
    const r = remind('overtime');
    if(r){ refreshRemind(); if(!VS.isSpeaking()) say([r]); } else toast('⏳ 时间到啦！不过别着急，慢慢把它做完');
  }
  if(ss.phase==='answer' && !ss.idleDone && ss.elapsed - (ss.lastAct||0) > 60000){
    ss.idleDone = true; const r = remind('idle'); if(r){ refreshRemind(); if(!VS.isSpeaking()) say([r]); }
  }
  updateTimer();
}, 250);

function finishQ(){
  const ss = S.session; const {pack,q} = findQ(ss.key); const t = today();
  const stepsTotal = q.steps.length, missed = ss.results.filter(r=>r.status==='missed').length, stepsOk = stepsTotal - missed;
  const firstAll = ss.results.every(r=>r.status==='first');
  const timeUsed = Math.round(ss.elapsed/1000), overtime = ss.overtime || timeUsed > q.timeLimitSec;
  const stars = missed ? 1 : (firstAll && !overtime) ? 3 : 2;
  let pts = ss.points + 5; if(!overtime) pts += 20; if(stars===3) pts += 15;
  const wasDue = D.review[ss.key] && D.review[ss.key].due<=t;
  const mode = (ss.mode==='review' || wasDue) ? 'review' : 'normal';
  D.attempts.push({key:ss.key, packId:pack.id, qid:q.id, ts:Date.now(), date:t, kps:q.knowledgePoints.slice(), difficulty:q.difficulty, stepsTotal, stepsOk, missed, overtime, timeUsed, limit:q.timeLimitSec, stars, points:pts, mode});
  // 间隔复习
  let reviewNote = '';
  const prev = D.review[ss.key];
  if(missed || overtime){
    D.review[ss.key] = {level:0, due:addDays(t,INTERVALS[0]), count:(prev?prev.count:0)+1, reason: missed?'wrong':'overtime', added: prev?prev.added:t};
    D.hadReview = true;
  } else if(prev && prev.due<=t){
    const lv = prev.level+1;
    if(lv>=INTERVALS.length){ delete D.review[ss.key]; reviewNote = '🎓 这道题已经彻底掌握，移出巩固队列！'; }
    else { D.review[ss.key] = Object.assign({}, prev, {level:lv, due:addDays(t,INTERVALS[lv])}); reviewNote = `👍 巩固成功！下次复习：${INTERVALS[lv]} 天后`; }
  }
  // 每日记录
  const r = dayRec(t); r.questions++; r.points += pts;
  if(mode==='review'){ if(!r.reviewDone.includes(ss.key)) r.reviewDone.push(ss.key); }
  else if(!r.newDone.includes(ss.key)) r.newDone.push(ss.key);
  D.points += pts;
  let autoChk = false; if(!D.checkins[t]){ D.checkins[t] = Date.now(); autoChk = true; }
  const goalBefore = r.goalDone;
  const newBadges = checkBadges({stars, difficulty:q.difficulty, missed, timeUsed, limit:q.timeLimitSec});
  const g = goalInfo(); if(g.done && !goalBefore){ r.goalDone = true; }
  save();
  ss.result = {stars, missed, stepsOk, stepsTotal, overtime, timeUsed, points:pts, newBadges, reviewNote};
  ss.phase = 'done';
  render(); window.scrollTo({top:0, behavior:'smooth'});
  confetti(stars===3 ? 220 : 140);
  hush(); const fr = remind('finish'); if(fr){ refreshRemind(); say([fr]); }
  setTimeout(()=>{
    if(g.done && !goalBefore){ toast('🎯 今日目标达成！给自己鼓个掌 👏'); confetti(160); }
    else if(autoChk) toast(`🔥 已自动打卡，连续 ${streak()} 天！`);
  }, 900);
}

  }));
  return {f:[...fm.values()], m:methods};
}

    <div class="row" style="margin-top:12px;gap:10px"><button class="btn ghost grow" data-act="export">⬇️ 导出备份</button><button class="btn ghost grow" data-act="importbk">⬆️ 导入备份</button></div>
    <button class="btn danger block" style="margin-top:12px" data-act="reset">🗑️ 清空所有数据</button></div>
  <div class="muted small" style="text-align:center;margin:16px 0">数学闯关岛 · 离线可用 · 数据保存在本机</div>`;
  return `<div class="topbar"><h1>🙋 ${esc(D.settings.nickname)}</h1><span class="sp"></span><span class="chip">💰 ${D.points} 积分</span><span class="chip">⭐ ${totalStars()}</span></div>
  <div class="seg"><button class="${S.meTab==='weak'?'on':''}" data-act="metab" data-v="weak">📊 薄弱项</button><button class="${S.meTab==='badge'?'on':''}" data-act="metab" data-v="badge">🏅 成就</button><button class="${S.meTab==='set'?'on':''}" data-act="metab" data-v="set">⚙️ 设置</button></div>
  ${S.meTab==='weak'?weakSec:S.meTab==='badge'?badgeSec:setSec}`;
}

/* ========== 主题 ========== */
const THEME_KEY = 'mathquest_theme';
function getTheme(){ try{ return localStorage.getItem(THEME_KEY) || 'eye'; }catch(e){ return 'eye'; } }
function isDark(t){ return t==='dark' || (t==='system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', isDark(t)?'#1F1F1C':'#F3EDDF');
}
if(window.matchMedia){ const mq = matchMedia('(prefers-color-scheme: dark)'); const f = ()=>{ if(getTheme()==='system') applyTheme('system'); }; mq.addEventListener ? mq.addEventListener('change',f) : mq.addListener && mq.addListener(f); }

/* ========== 弹窗 / 提示 / 撒花 ========== */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function modal(html){ $('#modal').innerHTML = `<div class="mask" data-act="maskclose"><div class="sheet">${html}</div></div>`; }
function closeModal(){ $('#modal').innerHTML=''; }
function confetti(n=150){
  const c = document.createElement('canvas'); c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:70';
  const W = c.width = innerWidth*devicePixelRatio, H = c.height = innerHeight*devicePixelRatio; c.style.width='100%'; c.style.height='100%';
  document.body.appendChild(c); const x = c.getContext('2d');
  const cols = (getComputedStyle(document.documentElement).getPropertyValue('--confetti')||'').split(',').map(x=>x.trim()).filter(Boolean);
  if(!cols.length) cols.push('#6E9584','#B98637','#B4614F');
  const ps = Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*W*.022, vy:-Math.random()*H*.022-H*.006, s:(Math.random()*8+5)*devicePixelRatio, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:pick(cols), sh:Math.random()<.5}));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0,0,W,H); const age = (t-t0)/1000;
    ps.forEach(p=>{ p.vy += H*.0006; p.vx *= .99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-age/3); x.fillStyle=p.c;
      if(p.sh) x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else { x.beginPath(); x.arc(0,0,p.s/3,0,7); x.fill(); } x.restore(); });
    if(age<3.2) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function copyText(text){
  const fb = () => { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok; };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>toast('📋 已复制'),()=>toast(fb()?'📋 已复制':'复制失败，请手动选择文字复制')); }
  else toast(fb()?'📋 已复制':'复制失败，请手动选择文字复制');
}
function download(name, text){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}
function importModal(){
  modal(`<h2>📥 导入题包</h2><div class="muted small">把 AI 助手返回的 JSON 粘贴到下面（带 \`\`\`json 代码块也没关系），或选择 .json 文件。</div>
  <textarea class="code" id="packText" placeholder='{"title":"期中测试","date":"2026-10-17","questions":[...]}' style="margin-top:10px"></textarea>
  <div class="row" style="margin-top:8px;gap:8px"><label class="btn sm ghost" style="cursor:pointer">📂 选择文件<input type="file" id="packFile" accept=".json,.txt,application/json,text/plain" hidden></label><button class="btn sm ghost" data-act="copyprompt">📋 复制 AI 提示词</button></div>
  <div id="impMsg" class="small" style="white-space:pre-wrap;margin-top:10px"></div>
  <div class="row" style="margin-top:12px;gap:10px"><button class="btn ghost grow" data-act="close">取消</button><button class="btn grow" data-act="doimport">校验并导入</button></div>`);
  $('#packFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $('#packText').value=r.result; act.doimport(); }; r.readAsText(f,'utf-8'); });
}

/* ========== 交互 ========== */
const act = {
  tab(d){ if(S.view==='play' && S.session && S.session.phase==='done') S.session=null; go(d.v); },
  resume(){ go('play'); },
  openpack(d){ S.packId=d.v; go('pack'); },
  start(d){ if(!d.k){ go('packs'); return; } startQ(d.k, d.mode||'normal'); },
  startreview(){ const q = dueKeys(); if(q.length) startQ(q[0],'review',q); },
  quit(){ hush(); const ss=S.session; if(ss && ss.phase==='done'){ act.backlist(); return; } const f = ss && findQ(ss.key); S.view = ss&&ss.mode==='review'?'review':'pack'; if(f) S.packId=f.pack.id; S.tab = S.view==='review'?'review':'packs'; render(); toast('进度已保留，可随时回来继续'); },
  backlist(){ hush(); const ss=S.session; const f=ss&&findQ(ss.key); const rv = ss&&ss.mode==='review'; S.session=null; if(rv) go('review'); else { if(f) S.packId=f.pack.id; go('pack'); } },
  retry(){ const k=S.session.key; startQ(k, S.session.mode); },
  nextq(d){ const ss=S.session; startQ(d.k, ss.queue?'review':'normal', ss.queue); },
  pintoggle(){ const v=!pinCollapsed(); setPinCollapsed(v); const pin=$('#pin'), b=pin&&pin.querySelector('.pintgl'); if(pin) pin.classList.toggle('collapsed', v); if(b){ b.textContent = v?'展开 ▾':'收起 ▴'; b.setAttribute('aria-expanded', v?'false':'true'); } const ob=$('#obody'); if(ob) ob.scrollTop=0; },
  sel(d){ const ss=S.session; if(ss.phase!=='answer') return; ss.sel=+d.v; ss.lastAct=ss.elapsed; document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel', i===ss.sel)); },
  key(d){ const inp=$('#ans'); if(!inp) return; S.session.lastAct=S.session.elapsed; const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s; inp.value = inp.value.slice(0,s)+d.v+inp.value.slice(e); S.session.draft=inp.value; inp.focus(); const p=s+d.v.length; try{inp.setSelectionRange(p,p);}catch(_){} },
  submit(){
    const ss=S.session; if(!ss||ss.phase!=='answer') return; const {q} = findQ(ss.key); const st=q.steps[ss.stepIdx];
    let val; if(st.type==='choice'){ if(ss.sel===null){ toast('先选一个答案吧 😊'); return; } val=ss.sel; } else { val = ($('#ans')||{}).value||ss.draft; if(!norm(val)){ toast('先写下你的答案吧 ✍️'); return; } ss.draft=val; }
    ss.lastAct = ss.elapsed; let speech = [];
    if(checkAnswer(st,val)){
      const pts = ss.tries===0?10:5; ss.points+=pts; ss.results[ss.stepIdx]={status:ss.tries===0?'first':'second', tries:ss.tries};
      ss.phase='feedback'; ss.fb={kind:'ok', msg:pick(MSG_OK), pts, fresh:true};
      ss.remind = null;
    } else {
      ss.tries++;
      if(ss.tries>=2){ ss.results[ss.stepIdx]={status:'missed', tries:ss.tries}; ss.phase='feedback'; ss.fb={kind:'miss', msg:pick(MSG_MISS), fresh:true};
        /* 不自动朗读答案和解析，可点 🔊 手动收听 */ }
      else { ss.fb={kind:'wrong', msg:pick(MSG_WRONG), fresh:true}; if(st.type==='choice') ss.sel=null;
        const r = Math.random()<0.6 ? remind('wrong') : null;
        speech = [r]; /* 只读温馨提醒；不重读题目、不自动读提示 */ }
    }
    render(); if(speech.some(Boolean)){ hush(); say(speech); }
  },
  next(){ hush(); const ss=S.session; const {q}=findQ(ss.key); if(ss.stepIdx>=q.steps.length-1){ finishQ(); return; } ss.stepIdx++; ss.tries=0; ss.fb=null; ss.draft=''; ss.sel=null; ss.phase='answer'; ss.lastAct=ss.elapsed; ss.idleDone=false;
    ss.remind = null; const r = (isCalcStep(q.steps[ss.stepIdx]) && Math.random()<0.35) ? remind('calc') : null;
    render(); say([r, autoStepSpeech(q, ss.stepIdx)]); },
  checkin(){ const t=today(); if(D.checkins[t]) return; D.checkins[t]=Date.now(); const nb=checkBadges(); save(); render(); confetti(90); toast(`🔥 打卡成功！已连续 ${streak()} 天`+(nb.length?' · 获得新徽章':'')); },
  import(){ importModal(); },
  copyprompt(){ copyText(AI_PROMPT); },
  doimport(){
    const m=$('#impMsg'); try{ const r = importPacksFromText($('#packText').value); closeModal(); S.packId=r.firstId; go('pack');
      toast(`✅ 导入成功：${r.added?`新增 ${r.added} 个题包`:''}${r.replaced?`更新 ${r.replaced} 个题包`:''}，共 ${r.qn} 道题`); }
    catch(e){ m.className='small err'; m.textContent='❌ '+e.message; }
  },
  delpack(d){ const bi = isBuiltinId(d.v); if(!confirm(bi?'恢复为内置版本吗？（做题记录和标记会保留）':'确定删除这个题包吗？（做题记录会保留）')) return; D.packs=D.packs.filter(p=>p.id!==d.v); if(!bi) Object.keys(D.review).forEach(k=>{ if(k.startsWith(d.v+'::')) delete D.review[k]; }); save(); go('packs'); toast('已删除'); },
  openmarks(d){ S.packId=d.v; go('marks'); },
  setmark(d){ const cur = D.marks[d.k]; const m = cur===d.v ? null : d.v; setMark(d.k, m); render(); if(S.view==='play') afterPlayMarkToast(m); },
  cyclemark(d){ const cur = D.marks[d.k]||null; const m = MARK_CYCLE[(MARK_CYCLE.indexOf(cur)+1)%MARK_CYCLE.length]; setMark(d.k, m); render(); },
  markrest(d){ const p = allPacks().find(x=>x.id===d.v); if(!p) return; p.questions.forEach(q=>{ const k=qk(p.id,q.id); if(!D.marks[k]) D.marks[k]='ok'; }); save(); render(); toast('✅ 已把未标记的题设为“对”'); },
  theme(d){ try{ localStorage.setItem(THEME_KEY, d.v); }catch(e){} D.settings.theme = d.v; save(); applyTheme(d.v); render(); toast(d.v==='eye'?'🌿 已切换到护眼模式':d.v==='dark'?'🌙 已切换到深色模式':'📱 已设为跟随系统'); },
  say(d){
    const ss = S.session; const f = ss && findQ(ss.key);
    if(d.w==='remind'){ if(ss && ss.remind) say([ss.remind.text]); return; }
    if(!f) return; const q = f.q, st = q.steps[ss.stepIdx];
    if(['orig','prompt','hint','exp','method'].includes(d.w)) say([MQVoiceTexts.forQuestion(q, d.w, ss.stepIdx)]);
  },
  hush(){ hush(); },
  closeremind(){ if(S.session) S.session.remind = null; refreshRemind(); },
  vset(d){ D.settings[d.k] = !D.settings[d.k]; save(); if(d.k==='voice' && !D.settings.voice) hush(); render(); },
  vrate(d){ D.settings.rate = d.v; save(); render(); say([MQVoiceTexts.EXTRA.ratePreview]); },
  vtest(){ say([MQVoiceTexts.EXTRA.test]); },
  ftab(d){ S.fTab=d.v; render(); },
  fkp(d){ S.fKp=d.v; if(S.view!=='formulas'){ go('formulas'); } else render(); },
  flip(d,el){ S.flipped[d.v]=!S.flipped[d.v]; el.classList.toggle('on'); },
  metab(d){ S.meTab=d.v; render(); },
  savesettings(){ D.settings.nickname = ($('#setName').value.trim()||'小数学家').slice(0,12); D.settings.goalNew = Math.max(0,Math.min(30,parseInt($('#setGoal').value)||0)); D.settings.goalReview = $('#setRev').checked; save(); render(); toast('✅ 设置已保存'); },
  export(){ const txt = JSON.stringify({app:'mathquest', version:1, exportedAt:new Date().toISOString(), data:D}, null, 2); download(`数学闯关岛备份-${today()}.json`, txt);
    modal(`<h2>⬇️ 导出备份</h2><div class="muted small">已尝试下载文件。如果手机上没有下载成功，可以复制下面的内容保存到备忘录。</div><textarea class="code" readonly style="margin-top:10px">${esc(txt)}</textarea><div class="row" style="gap:10px;margin-top:10px"><button class="btn ghost grow" data-act="copybk">📋 复制</button><button class="btn grow" data-act="close">完成</button></div>`); S._bk=txt; },
  copybk(){ copyText(S._bk||''); },
  importbk(){ modal(`<h2>⬆️ 导入备份</h2><div class="small err">导入会覆盖当前设备上的全部学习记录。</div><textarea class="code" id="bkText" placeholder="粘贴备份 JSON" style="margin-top:10px"></textarea><div class="row" style="margin-top:8px"><label class="btn sm ghost" style="cursor:pointer">📂 选择备份文件<input type="file" id="bkFile" accept=".json,.txt,application/json" hidden></label></div><div id="bkMsg" class="small" class="small err" style="margin-top:8px"></div><div class="row" style="gap:10px;margin-top:12px"><button class="btn ghost grow" data-act="close">取消</button><button class="btn grow" data-act="dobk">导入</button></div>`);
    $('#bkFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ $('#bkText').value=r.result; }; r.readAsText(f,'utf-8'); }); },
  dobk(){ try{ const o = extractJSON($('#bkText').value); const data = o && o.app==='mathquest' ? o.data : o; if(!data || !Array.isArray(data.attempts) || !data.settings) throw new Error('不是有效的备份文件');
      if(!confirm('确定用备份覆盖当前数据吗？')) return; D = Object.assign(defData(), data); save(); if(D.settings && D.settings.theme){ try{ localStorage.setItem(THEME_KEY, D.settings.theme); }catch(e){} applyTheme(D.settings.theme); } closeModal(); go('home'); toast('✅ 备份已恢复'); }
    catch(e){ $('#bkMsg').textContent='❌ '+e.message; } },
  reset(){ if(!confirm('确定清空所有学习数据吗？导入的题包、做题记录、徽章都会被删除。')) return; if(!confirm('真的确定吗？此操作无法撤销。')) return; localStorage.removeItem(KEY); load(); S.session=null; go('home'); toast('已清空，重新出发吧！'); },
  close(){ closeModal(); },
  maskclose(d,el,e){ if(e.target===el) closeModal(); }
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = act[el.dataset.act]; if(!fn) return;
  if(el.tagName==='BUTTON' || el.dataset.act==='flip' || el.dataset.act==='maskclose'){ fn(el.dataset, el, e); }
});
/* 内置普通话录音清单（构建时内嵌；网页版另外尝试加载 audio/manifest.json 以获取后来补生成的录音） */
try{ VS.addClips(JSON.parse(document.getElementById('audio-manifest').textContent||'[]')); }catch(e){}
if(/^https?:/.test(location.protocol)){ fetch('audio/manifest.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(m=>{ if(m&&m.clips) VS.addClips(Object.keys(m.clips)); }).catch(()=>{}); }
VS.whenVoices(1500).then(()=>{ if(S.view==='me' && S.meTab==='set') render(); });
VS.onNotice(kind=>{
  if(kind!=='nomandarin') return; let seen=false; try{ seen = localStorage.getItem('mathquest_voice_notice')==='1'; localStorage.setItem('mathquest_voice_notice','1'); }catch(e){}
  if(seen) return;
  if(S.view==='play'){ voiceNoticePending=true; toast('本机没有普通话语音，新导入的题暂不朗读'); return; } /* 做题时不弹窗打断，回到其他页面再说明 */
  showVoiceNotice();
});
let voiceNoticePending=false;
function showVoiceNotice(){
  voiceNoticePending=false;
  modal(`<h2>🔈 本机没有普通话语音</h2><div class="muted" style="font-size:14.5px">内置题目使用<b>内置普通话录音</b>，不受影响。新导入的题目需要系统的普通话语音才能朗读——为了避免读成粤语，暂时不朗读。<br><br><b>iPhone / iPad：</b>设置 → 辅助功能 → 朗读内容 → 声音 → 中文 → 下载“婷婷”等普通话声音。<br><b>安卓：</b>设置 → 文字转语音（TTS）→ 首选引擎（如 Google）→ 安装语音数据 → 中文（中国）普通话。<br><br>也可以在「我的 → 设置 → 朗读声音」里手动选择声音。</div><button class="btn block" data-act="close" style="margin-top:14px">知道了</button>`);
}
document.addEventListener('change', e=>{ if(e.target && e.target.id==='voicePick'){ D.settings.voicePick = e.target.value; save(); render(); say([MQVoiceTexts.EXTRA.ratePreview]); } });
/* 首次触摸/点击即解锁 iPad Safari 的音频（捕获阶段，先于按钮处理） */
['touchend','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev, ()=>{ if(VS.unlock) VS.unlock(); }, {capture:true, passive:true}));
VS.onChange(sp=>{ const on=!!sp && voiceOn(); const b=$('#speakbar'); if(b) b.classList.toggle('show', on); document.body.classList.toggle('speaking', on); });
window.addEventListener('storage', e=>{ if(e.key===KEY){ load(); render(); } });
window.__mqKatexReady = () => render();
render();
})();
