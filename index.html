<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>数学闯关岛 · 初中数学练习</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" onerror="this.remove()">
<style>
:root{
  --bg:#f3f5fb; --card:#fff; --ink:#24264a; --sub:#6b7095; --line:#e7e9f4;
  --pri:#6c5ce7; --pri2:#4f8cff; --pri-soft:#efecff;
  --ok:#14b88a; --ok-soft:#e3f8f0; --bad:#ff6b6b; --bad-soft:#fff0f0;
  --warn:#ff9f43; --warn-soft:#fff4e6; --gold:#ffc23d;
  --r:20px; --shadow:0 6px 20px rgba(60,64,140,.08);
  --tabh:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;font-size:16px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom));position:relative}
.topbar{display:flex;align-items:center;gap:10px;padding:18px 2px 10px}
.topbar h1{font-size:22px;margin:0;font-weight:800;letter-spacing:.5px}
.topbar .sp{flex:1}
.iconbtn{width:42px;height:42px;border-radius:14px;background:#fff;box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 20px;border-radius:16px;font-weight:700;background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(108,92,231,.28);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:var(--pri-soft);color:var(--pri);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 6px 16px rgba(20,184,138,.28)}
.btn.warn{background:var(--warn);box-shadow:0 6px 16px rgba(255,159,67,.3)}
.btn.danger{background:var(--bad-soft);color:#d84848;box-shadow:none}
.btn.white{background:#fff;color:var(--pri);box-shadow:none}
.btn:disabled{opacity:.5}
.btn.sm{min-height:38px;padding:0 14px;border-radius:12px;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:#0e936d}.chip.bad{background:var(--bad-soft);color:#d84848}.chip.warn{background:var(--warn-soft);color:#d9771b}.chip.gray{background:#eef0f6;color:var(--sub)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hero{background:linear-gradient(135deg,#6c5ce7 0%,#4f8cff 100%);color:#fff;border-radius:24px;padding:18px;margin-top:14px;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(79,108,255,.3)}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{content:"";position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .greet{font-size:14px;opacity:.9}
.hero .name{font-size:24px;font-weight:800;margin:2px 0 12px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.stat{background:rgba(255,255,255,.16);border-radius:16px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{font-size:12px;opacity:.9}
.goalwrap{display:flex;gap:16px;align-items:center}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:800;font-size:20px}
.ring .lbl small{display:block;font-size:11px;color:var(--sub);font-weight:600}
.goalitem{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.goalitem .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#eef0f6}
.goalitem .dot.done{background:var(--ok);color:#fff}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qcard{border-radius:20px;padding:14px;color:#fff;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;box-shadow:var(--shadow)}
.qcard .big{font-size:28px;font-weight:800;line-height:1}
.qcard .t{font-weight:700}
.qcard .s{font-size:12px;opacity:.9}
.g1{background:linear-gradient(135deg,#ff9f43,#ff6b8b)}
.g2{background:linear-gradient(135deg,#14b88a,#3cc8d8)}
.g3{background:linear-gradient(135deg,#8e7dff,#c06cf0)}
.g4{background:linear-gradient(135deg,#4f8cff,#46c3ff)}
.checkin{display:flex;align-items:center;gap:12px}
.flame{font-size:34px;filter:drop-shadow(0 4px 6px rgba(255,120,40,.35))}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:#eceef6;display:block}
.heat i.l1{background:#d8d2ff}.heat i.l2{background:#ab9cff}.heat i.l3{background:#7f6af0}.heat i.l4{background:#5a45d6}
.heat i.today{outline:2px solid var(--warn);outline-offset:1px}
.heat i.fut{background:transparent}
.legend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--sub);justify-content:flex-end;margin-top:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .item:last-child{border-bottom:0}
.item .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--pri-soft)}
.item .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.packcard{display:block;width:100%;text-align:left}
.prog{height:8px;border-radius:99px;background:#eceef6;overflow:hidden}
.prog > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.qrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px;border-radius:18px;background:#fff;box-shadow:var(--shadow);margin:10px 0}
.qnum{width:36px;height:36px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none}
.qrow .txt{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.stars .off{color:#dfe2ee}
/* play */
.playhead{display:flex;align-items:center;gap:10px;padding:14px 0 6px;position:sticky;top:0;background:var(--bg);z-index:5}
.timer{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.timer.low{color:var(--warn)}
.timer.over{background:var(--bad);color:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.tbar{height:6px;border-radius:99px;background:#e6e8f3;overflow:hidden;margin:4px 0 2px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7ad6b3);transition:width .25s linear}
.tbar.low i{background:linear-gradient(90deg,var(--warn),#ffc27a)}
.tbar.over i{background:var(--bad)}
.orig{font-size:16.5px;line-height:1.8}
.orig .lab{font-size:12px;font-weight:800;color:var(--pri);letter-spacing:1px}
.stepdots{display:flex;gap:6px;margin:6px 0}
.stepdots i{flex:1;height:8px;border-radius:99px;background:#e2e5f1}
.stepdots i.cur{background:var(--pri)}
.stepdots i.first,.stepdots i.second{background:var(--ok)}
.stepdots i.missed{background:var(--bad)}
.donestep{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:#fff;margin:8px 0;font-size:14px;box-shadow:var(--shadow)}
.donestep .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;flex:none;margin-top:1px}
.stepcard{border:2px solid var(--pri-soft)}
.steplab{display:inline-block;background:var(--pri);color:#fff;border-radius:10px;padding:2px 10px;font-size:12.5px;font-weight:800;margin-bottom:8px}
.prompt{font-size:17px;font-weight:600;line-height:1.75;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border-radius:16px;background:#f6f7fc;border:2px solid transparent;text-align:left;font-size:16px;transition:all .12s}
.opt .k{width:30px;height:30px;border-radius:10px;background:#fff;display:grid;place-items:center;font-weight:800;color:var(--pri);flex:none}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ans{width:100%;min-height:56px;border-radius:16px;border:2px solid var(--line);padding:0 16px;font-size:20px;font-weight:700;background:#f9faff;outline:none}
.ans:focus{border-color:var(--pri);background:#fff}
.keys{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.keys button{min-width:46px;height:40px;border-radius:12px;background:#eef0f8;font-weight:800;font-size:17px}
.fb{border-radius:16px;padding:12px 14px;margin-top:12px;font-size:15px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}.fb.hint{background:var(--warn-soft)}.fb.exp{background:#f1f4ff}
.fb b.t{display:block;margin-bottom:4px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}
.result{text-align:center}
.result .bigstars{font-size:44px;letter-spacing:6px;margin:6px 0}
.result .bigstars .off{filter:grayscale(1);opacity:.25}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kv div{background:#f6f7fc;border-radius:14px;padding:10px 4px}
.kv b{display:block;font-size:20px}
.kv span{font-size:12px;color:var(--sub)}
.formula{background:#f7f6ff;border-radius:14px;padding:10px 12px;margin:8px 0}
/* bars */
.bar{margin:10px 0}
.bar .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .prog i.lo{background:linear-gradient(90deg,#ff6b6b,#ff9f8b)}
.bar .prog i.mid{background:linear-gradient(90deg,#ff9f43,#ffc56f)}
.bar .prog i.hi{background:linear-gradient(90deg,#14b88a,#5fd6b0)}
.weakpill{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:linear-gradient(135deg,#fff3ec,#fff);border:1px solid #ffe2cc;margin:8px 0}
.weakpill .n{width:30px;height:30px;border-radius:10px;background:var(--warn);color:#fff;display:grid;place-items:center;font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:#f6f7fc}
.badge .e{font-size:30px}
.badge .n{font-weight:700;font-size:13px}
.badge .d{font-size:11px;color:var(--sub)}
.badge.lock .e{filter:grayscale(1);opacity:.3}
.badge.lock{background:#f8f9fc}
.badge.got{background:linear-gradient(135deg,#fff8e1,#fff);border:1px solid #ffe7a3}
/* flash cards */
.fgrid{display:grid;grid-template-columns:1fr;gap:12px}
.flip{perspective:1000px;height:190px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:16px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:auto}
.flip .f{background:linear-gradient(135deg,#7b6cf6,#5f8dff);color:#fff;justify-content:center;align-items:center;text-align:center}
.flip .f.m{background:linear-gradient(135deg,#ff9f43,#ff7a8a)}
.flip .f .nm{font-size:21px;font-weight:800;margin:8px 0}
.flip .f .tap{font-size:12px;opacity:.85}
.flip .bk{background:#fff;transform:rotateY(180deg);justify-content:center}
.flip .bk .ltx{font-size:20px;text-align:center;margin:6px 0 10px;overflow-x:auto}
.seg{display:flex;background:#e9ebf5;border-radius:14px;padding:4px;gap:4px;margin:6px 0 10px}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:700;color:var(--sub)}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;padding:8px 14px;border-radius:99px;background:#fff;font-size:14px;font-weight:600;box-shadow:var(--shadow);color:var(--sub)}
.filter button.on{background:var(--pri);color:#fff}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;color:#9a9fbd;font-weight:600;position:relative}
.tabbar button .e{font-size:22px;filter:grayscale(1);opacity:.65;transition:all .15s}
.tabbar button.on{color:var(--pri)}
.tabbar button.on .e{filter:none;opacity:1;transform:translateY(-2px) scale(1.08)}
.tabbar .badge-n{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:800}
/* modal & toast */
.mask{position:fixed;inset:0;background:rgba(30,32,70,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .25s}
@media(min-width:600px){.mask{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
@keyframes fade{from{opacity:0}}
.sheet h2{margin:0 0 10px;font-size:20px}
textarea.code{width:100%;min-height:180px;border-radius:14px;border:2px solid var(--line);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#f9faff;outline:none}
textarea.code:focus{border-color:var(--pri)}
.field{margin:12px 0}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--line);padding:0 14px;background:#f9faff;outline:none}
.switch{display:flex;align-items:center;justify-content:space-between;min-height:48px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-120px);background:#24264a;color:#fff;padding:12px 18px;border-radius:16px;z-index:60;font-weight:600;font-size:15px;max-width:90vw;text-align:center;transition:transform .3s cubic-bezier(.2,1.4,.4,1);box-shadow:0 10px 30px rgba(0,0,0,.2)}
#toast.show{transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:26px 10px;color:var(--sub)}
.empty .e{font-size:44px}
.mathfb{font-family:"Times New Roman",serif;font-style:italic}
.katex{font-size:1.08em}
.sec-title{font-size:15px;font-weight:800;color:var(--sub);margin:22px 4px 4px;letter-spacing:.5px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--warn-soft);color:#b8610f;font-weight:700;margin:10px 0;width:100%;text-align:left}
.newbadge{text-align:center}
.newbadge .e{font-size:70px;animation:pop .5s}
a{color:var(--pri)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mnum{width:52px;height:52px;border-radius:16px;background:#f1f2f8;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font-weight:800;line-height:1.1;border:2px solid transparent}
.mnum span{font-size:13px}.mnum i{font-style:normal;font-size:17px}
.mnum.ok{background:var(--ok-soft);border-color:#9fe3cc}.mnum.bad{background:var(--bad-soft);border-color:#ffc0c0}.mnum.warn{background:var(--warn-soft);border-color:#ffd4a3}
.mprev{font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mseg{display:flex;gap:4px;flex:none}
.mseg button{width:40px;height:44px;border-radius:12px;background:#f4f5fa;font-size:17px;filter:grayscale(.9);opacity:.55;border:2px solid transparent}
.mseg button.on{filter:none;opacity:1}.mseg button.on.ok{background:var(--ok-soft);border-color:var(--ok)}.mseg button.on.bad{background:var(--bad-soft);border-color:var(--bad)}.mseg button.on.warn{background:var(--warn-soft);border-color:var(--warn)}
.markrow{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);flex-wrap:wrap}
.mpill{padding:6px 10px;border-radius:99px;background:#f4f5fa;font-size:13px;font-weight:700;color:var(--sub);border:2px solid transparent;min-height:36px}
.mpill.on.ok{background:var(--ok-soft);color:#0e936d;border-color:var(--ok)}.mpill.on.bad{background:var(--bad-soft);color:#d84848;border-color:var(--bad)}.mpill.on.warn{background:var(--warn-soft);color:#d9771b;border-color:var(--warn)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar"><div class="in" id="tabs"></div></nav>
<div id="toast"></div>
<div id="modal"></div>
<script type="application/json" id="demo-pack">
{
  "id": "demo-pack-v1",
  "title": "示例题包 · 初一初二综合练习",
  "date": "2026-10-17",
  "questions": [
    {
      "id": "d1",
      "original": "解方程：$3(x-2)=2x+1$",
      "knowledgePoints": ["一元一次方程"],
      "difficulty": 2,
      "timeLimitSec": 120,
      "steps": [
        {
          "prompt": "第一步先去括号：$3(x-2)$ 展开后等于多少？",
          "type": "choice",
          "options": ["$3x-6$", "$3x-2$", "$x-6$", "$3x+6$"],
          "answer": "A",
          "hint": "括号外的 $3$ 要分别乘括号里的每一项，别漏了 $-2$ 哦。",
          "explanation": "$3(x-2)=3\\cdot x-3\\cdot 2=3x-6$，方程变为 $3x-6=2x+1$。"
        },
        {
          "prompt": "移项：把含 $x$ 的项移到左边，常数项移到右边，得到 $3x-2x=1+\\square$。方框里填多少？",
          "type": "number",
          "answer": "6",
          "hint": "$-6$ 从左边移到右边要变号。",
          "explanation": "移项要变号：$-6$ 移到右边变成 $+6$，所以 $3x-2x=1+6$。"
        },
        {
          "prompt": "合并同类项，求出 $x=$ ？",
          "type": "number",
          "answer": "7",
          "hint": "左边 $3x-2x=x$，右边 $1+6=?$",
          "explanation": "合并得 $x=7$。可以代回检验：左边 $3\\times(7-2)=15$，右边 $2\\times7+1=15$ ✔"
        }
      ],

27", "hint": "把 3 移进根号要平方：$3=\\sqrt9$。", "explanation": "$3\\sqrt3=\\sqrt{9\\times3}=\\sqrt{27}$。"}, {"prompt": "$\\sqrt{25}<\\sqrt{27}<\\sqrt{36}$，所以 $n=$ ？", "type": "number", "answer": "5", "hint": "$\\sqrt{25}=5,\\sqrt{36}=6$。", "explanation": "$5<3\\sqrt3<6$，$n=5$。"}], "finalAnswer": "$5$", "formulas": [{"name": "估算", "latex": "\\sqrt{k^2}<\\sqrt m<\\sqrt{(k+1)^2}\\Rightarrow k<\\sqrt m<k+1", "tip": "找夹住被开方数的两个相邻完全平方数。"}], "method": "把系数移入根号变成 $\\sqrt{27}$，再找相邻完全平方数。"}, {"id": "q16", "original": "一元二次方程 $(3-x)=(3-x)^2$ 的解是______。", "knowledgePoints": ["因式分解法解一元二次方程"], "difficulty": 2, "timeLimitSec": 90, "steps": [{"prompt": "能不能两边同时除以 $(3-x)$？", "type": "choice", "answer": "B", "hint": "如果 $3-x=0$ 呢？", "explanation": "不能！$3-x$ 可能为 0，除掉会丢根。应移项后提公因式。", "options": ["可以", "不可以，会丢根"]}, {"prompt": "移项：$(3-x)-(3-x)^2=0$，提公因式得 $(3-x)(1-3+x)=0$，即 $(3-x)(x-2)=0$。较小的根是？", "type": "number", "answer": "2", "hint": "每个因式分别等于 0。", "explanation": "$x-2=0\\Rightarrow x=2$。"}, {"prompt": "较大的根是？", "type": "number", "answer": "3", "hint": "$3-x=0$。", "explanation": "$x_1=2,\\ x_2=3$。"}], "finalAnswer": "$x_1=2,\\ x_2=3$", "formulas": [{"name": "因式分解法", "latex": "AB=0\\Rightarrow A=0\\text{ 或 }B=0", "tip": "不要两边约去含未知数的式子，会丢根。"}], "method": "移项后提取公因式 $(3-x)$，转化为两个一次方程。"}, {"id": "q17", "original": "一元二次方程 $(2x-1)^2=(3-x)^2$ 的解是______。", "knowledgePoints": ["直接开平方法", "因式分解法解一元二次方程"], "difficulty": 3, "timeLimitSec": 120, "steps": [{"prompt": "由 $A^2=B^2$ 可得？", "type": "choice", "answer": "C", "hint": "平方相等的两个数，可能相等也可能互为相反数。", "explanation": "$A^2=B^2\\Rightarrow A=B$ 或 $A=-B$。", "options": ["只有 $A=B$", "只有 $A=-B$", "$A=B$ 或 $A=-B$", "$A=B=0$"]}, {"prompt": "情况一：$2x-1=3-x$，解得 $x=$ ？", "type": "number", "answer": "4/3", "hint": "移项得 $3x=4$。", "explanation": "$3x=4\\Rightarrow x=\\dfrac43$。（常见错误：算成 $x=4$，忘了除以 3）", "acceptable": ["4/3", "1又1/3"]}, {"prompt": "情况二：$2x-1=-(3-x)=x-3$，解得 $x=$ ？", "type": "number", "answer": "-2", "hint": "移项得 $2x-x=-3+1$。", "explanation": "$x=-2$。所以 $x_1=\\dfrac43,\\ x_2=-2$。"}], "finalAnswer": "$x_1=\\dfrac43,\\ x_2=-2$", "formulas": [{"name": "平方差因式分解", "latex": "A^2-B^2=(A+B)(A-B)", "tip": "也可以移项后用平方差：$(2x-1+3-x)(2x-1-3+x)=0$。"}], "method": "$A^2=B^2$ 转化为 $A=\\pm B$ 两个一次方程，解完代回检验。"}, {"id": "q18", "original": "有一件商品，由原售价连续两次降价，每次降价的百分率相同。已知原售价是 800 元，降价两次后的售价是 578 元，若每次下降的百分率是 $x$，由题意列出关于 $x$ 的方程：______。", "knowledgePoints": ["一元二次方程的应用", "增长率（降低率）问题"], "difficulty": 2, "timeLimitSec": 90, "steps": [{"prompt": "第一次降价后，售价是？", "type": "choice", "answer": "B", "hint": "降低 $x$，剩下原来的 $(1-x)$。", "explanation": "$800(1-x)$。", "options": ["$800x$", "$800(1-x)$", "$800-x$", "$800(1+x)$"]}, {"prompt": "第二次在新价格基础上再降 $x$，两次后的售价是？", "type": "choice", "answer": "A", "hint": "在 $800(1-x)$ 基础上再乘 $(1-x)$。", "explanation": "$800(1-x)^2$，所以方程为 $800(1-x)^2=578$。", "options": ["$800(1-x)^2$", "$800(1-2x)$", "$800-2x$", "$800(1-x^2)$"]}], "finalAnswer": "$800(1-x)^2=578$", "formulas": [{"name": "降低率公式", "latex": "a(1-x)^n=b", "tip": "$a$ 原量，$b$ 降低 $n$ 次后的量；增长率则用 $(1+x)$。"}], "method": "连续两次按相同百分率降低，用 $a(1-x)^2=b$。注意不是 $1-2x$。"}, {"id": "q19", "original": "若关于 $x$ 的一元二次方程 $(m-1)x^2-2mx+(m+2)=0$ 有两个不等的实数根，则 $m$ 的取值范围是______。", "knowledgePoints": ["根的判别式", "一元二次方程的定义"], "difficulty": 3, "timeLimitSec": 150, "steps": [{"prompt": "“两个不等的实数根”要求判别式满足？", "type": "choice", "answer": "A", "hint": "不需要用求根公式，只看 Δ。", "explanation": "$\\Delta>0$。", "options": ["$\\Delta>0$", "$\\Delta=0$", "$\\Delta<0$", "$\\Delta\\ge0$"]}, {"prompt": "$\\Delta=(-2m)^2-4(m-1)(m+2)=4m^2-4(m^2+m-2)=8-4m>0$，解得 $m<$ ？", "type": "number", "answer": "2", "hint": "$8-4m>0\\Rightarrow 4m<8$。", "explanation": "$m<2$。"}, {"prompt": "还要满足二次项系数 $m-1\\ne0$，即 $m\\ne$ ？", "type": "number", "answer": "1", "hint": "一元二次方程的 $a\\ne0$。", "explanation": "$m\\ne1$。所以答案是 $m<2$ 且 $m\\ne1$。"}], "finalAnswer": "$m<2$ 且 $m\\ne1$", "formulas": [{"name": "根的判别式", "latex": "\\Delta=b^2-4ac", "tip": "Δ>0 两个不等实根；Δ=0 两个相等实根；Δ<0 没有实根。"}, {"name": "一元二次方程定义", "latex": "a\\ne0", "tip": "求参数范围时，“判别式”和“ function fallbackTex(t){
  let s = t.replace(/\\cdots|\\ldots|\\dots/g,'…').replace(/\\left|\\right/g,'').replace(/\\[dt]frac/g,'\\frac');
  for(let i=0;i<4;i++){

    .replace(/\\Rightarrow/g,'⇒').replace(/\\to/g,'→').replace(/\\square/g,'□').replace(/\\cdots|\\ldots|\\dots/g,'…').replace(/\\dot\{?(\w)\}?/g,'$1\u0307').replace(/\\quad|\\qquad|\\[ ,;!]/g,' ')

}

function toHalf(s){ return s.replace(/[\uFF01-\uFF5E]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\u3000/g,' '); }
function norm(s){
  s = toHalf(String(s ?? '')).trim();
  s = s.replace(/\$/g,'').replace(/\\left|\\right/g,'').replace(/\\cdot|\\times/g,'*').replace(/\\div/g,'/');
  for(let i=0;i<3;i++) s = s.replace(/\\d?frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g,'√($1)');

  else if((m = s.match(/^([+-]?\d*\.?\d*)√(\d+\.?\d*)$/))){ const c = m[1]===''||m[1]==='+'?1:m[1]==='-'?-1:parseFloat(m[1]); v = c*Math.sqrt(parseFloat(m[2])); }

function decimals(raw){ const m = norm(raw).match(/\.(\d+)$/); return m ? m[1].length : 0; }
function numEq(user, exp){
  const a = parseNum(user), b = parseNum(exp);

  if(/^[A-Ha-h]$/.test(s)) return ok(s.toUpperCase().charCodeAt(0)-65);
  const n = norm(s); const i = opts.findIndex(o=>norm(o)===n);
  if(i>=0) return i;
  if(/^\d+$/.test(s) && +s < opts.length) return +s;
  return -1;
}
function checkAnswer(step, input){
  const cands = [step.answer, ...(step.acceptable||[])];
  if(step.type==='choice'){ return cands.some(c=>choiceIndex(step,c)===input); }
  const u = String(input ?? '');
  if(!norm(u)) return false;
  const stripVar = s => s.replace(/^[a-z]{1,3}=/,'');
  return cands.some(c=>{
    if(numEq(u,c)) return true;
    const nu = norm(u), nc = norm(c);
    if(nu===nc || stripVar(nu)===stripVar(nc)) return true;
    return false;
  });
}
window.__mqCheck = {norm, parseNum, checkAnswer, choiceIndex, allPacks: () => allPacks()}; // 便于调试

function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
function extractJSON(text){
  let t = String(text||'').trim().replace(/^\uFEFF/,'');
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i); if(fence) t = fence[1].trim();
  try{ return JSON.parse(t); }catch(e){
    const a = t.indexOf('{'), b = t.lastIndexOf('}');
    if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e2){} }
    throw new Error('JSON 格式有误：'+e.message);
  }
}
function validatePack(p, idx){
  const errs = [], warns = [];
  const L = idx!=null ? `第${idx+1}个题包：` : '';
  if(!p || typeof p!=='object') throw new Error(L+'不是有效的对象');
  if(!Array.isArray(p.questions) || !p.questions.length) throw new Error(L+'缺少 questions 数组（至少 1 道题）');
  const pack = { id: String(p.id || ('pk-'+hash((p.title||'')+'|'+(p.date||'')+'|'+p.questions.length+'|'+(p.questions[0]&&p.questions[0].original||'')))),
    title: String(p.title || '未命名题包'), date: String(p.date || today()), questions: [], importedAt: Date.now() };
  const ids = new Set();
  p.questions.forEach((q,i)=>{
    const QL = `${L}第${i+1}题`;
    if(!q || typeof q!=='object'){ errs.push(QL+'格式错误'); return; }
    if(!q.original) errs.push(QL+'缺少 original（原题）');
    let id = String(q.id ?? ('q'+(i+1))); if(ids.has(id)) id = id+'_'+i; ids.add(id);
    const steps = Array.isArray(q.steps) ? q.steps : [];
    if(!steps.length) errs.push(QL+'缺少 steps（引导步骤）');
    const st = steps.map((s,j)=>{
      const SL = `${QL}第${j+1}步`;
      let type = ['choice','number','text'].includes(s.type) ? s.type : (Array.isArray(s.options)&&s.options.length ? 'choice' : 'text');
      if(s.answer===undefined || s.answer===null || s.answer==='') errs.push(SL+'缺少 answer');
      if(!s.prompt) warns.push(SL+'缺少 prompt');
      const o = {prompt:String(s.prompt||'请作答'), type, answer: s.answer, acceptable: Array.isArray(s.acceptable)?s.acceptable.map(String):[], hint:String(s.hint||'再仔细读一遍题目，想想用到了哪个知识点。'), explanation:String(s.explanation||'')};
      if(type==='choice'){
        o.options = Array.isArray(s.options) ? s.options.map(String) : [];
        if(o.options.length<2) errs.push(SL+'是选择题但 options 少于 2 个');
        else if(choiceIndex(o,o.answer)<0) errs.push(SL+'的 answer 不在 options 中（可用 "A"/"B" 或选项原文）');
      }
      if(typeof o.answer==='number') o.answer = type==='choice' ? o.answer : String(o.answer);
      return o;
    });
    const tl = +q.timeLimitSec;
    pack.questions.push({ id, original:String(q.original||''), knowledgePoints: (Array.isArray(q.knowledgePoints)&&q.knowledgePoints.length ? q.knowledgePoints : ['综合']).map(String),
      difficulty: Math.min(5,Math.max(1,Math.round(+q.difficulty||2))), timeLimitSec: tl>0 ? Math.round(tl) : 180, steps: st,
      finalAnswer: String(q.finalAnswer||''), formulas: (Array.isArray(q.formulas)?q.formulas:[]).filter(f=>f&&(f.name||f.latex)).map(f=>({name:String(f.name||'公式'),latex:String(f.latex||''),tip:String(f.tip||'')})),
      method: String(q.method||'') });
  });
  if(errs.length) throw new Error(errs.slice(0,8).join('\n')+(errs.length>8?`\n…等共 ${errs.length} 处问题`:''));
  return {pack, warns};
}
function importPacksFromText(text){
  const obj = extractJSON(text);
  let list = Array.isArray(obj) ? obj : (obj && Array.isArray(obj.packs) ? obj.packs : [obj]);
  if(obj && obj.app==='mathquest' && obj.data) throw new Error('这是“学习进度备份”文件，请到「我的 → 数据备份」里导入。');
  const results = list.map((p,i)=>validatePack(p, list.length>1?i:null));
  let added=0, replaced=0, qn=0;
  results.forEach(({pack})=>{
    const i = D.packs.findIndex(x=>x.id===pack.id);
    if(i>=0){ D.packs[i]=pack; replaced++; } else if(isBuiltinId(pack.id)){ D.packs.push(pack); replaced++; } else { D.packs.push(pack); added++; }
    qn += pack.questions.length;
  });
  D.badges.importer = D.badges.importer || Date.now();
  save();
  return {added, replaced, qn, warns: results.flatMap(r=>r.warns), firstId: results[0].pack.id};
}

function kpStats(){
  const m = {};
  D.attempts.forEach(a=>{
    (a.kps||[]).forEach(kp=>{
      const s = m[kp] || (m[kp] = {kp, att:0, steps:0, ok:0, clean:0, ot:0, time:0, pr:0, init:0});
      s.att++; s.pr++; s.steps+=a.stepsTotal; s.ok+=a.stepsOk; if(!a.missed) s.clean++; if(a.overtime) s.ot++; s.time+=a.timeUsed;
    });
  });
  Object.keys(D.marks).forEach(key=>{ // 试卷初始“错/没做”记为该知识点的一次失误
    if(!isMiss(D.marks[key])) return; const f = findQ(key); if(!f) return;
    f.q.knowledgePoints.forEach(kp=>{ const s = m[kp] || (m[kp] = {kp, att:0, steps:0, ok:0, clean:0, ot:0, time:0, pr:0, init:0}); s.att++; s.init++; s.steps += f.q.steps.length; });
  });
  return Object.values(m).map(s=>{
    s.acc = s.steps ? s.ok/s.steps : 0; s.otRate = s.att ? s.ot/s.att : 0; s.avg = s.pr ? s.time/s.pr : 0;
    s.weak = (1-s.acc) + 0.5*(1-s.clean/s.att) + 0.4*s.otRate;
    return s;
  }).sort((a,b)=>b.weak-a.weak);
}
function weakMap(){ const m={}; kpStats().forEach(s=>m[s.kp]=s.weak); return m; }
function streak(){
  let n=0, d=today();
  if(!D.checkins[d]) d = addDays(d,-1);
  while(D.checkins[d]){ n++; d = addDays(d,-1); }
  return n;
}
function bestStreak(){
  const ds = Object.keys(D.checkins).sort(); let best=0, cur=0, prev=null;
  ds.forEach(d=>{ cur = prev && dayDiff(prev,d)===1 ? cur+1 : 1; best=Math.max(best,cur); prev=d; });
  return best;
}
function goalInfo(){
  const r = dayRec(); const due = dueKeys().length;
  const rt = D.settings.goalReview ? r.reviewDone.length + due : 0;
  const nt = Math.max(0, +D.settings.goalNew||0);
  const rd = Math.min(r.reviewDone.length, rt), nd = Math.min(r.newDone.length, nt);
  const total = rt+nt; const pct = total ? (rd+nd)/total : 1;
  return {rt, nt, rd, nd, due, pct, done: total>0 && rd+nd>=total};
}

  if(D.attempts.length>=10) give('ten');
  if(ctx){
    if(ctx.stars===3) give('perfect');
    if(ctx.difficulty>=4 && !ctx.missed) give('hard');

/* ========== 视图：闯关做题 ========== */
const MSG_OK = ['漂亮！✨','完全正确！','思路很清晰 👍','太棒了，继续保持！','稳！就是这样 💪','答对啦，你真行！'];
const MSG_WRONG = ['差一点点！看看提示再试一次 💪','别急，错误是学习的一部分～','思路已经在路上了，再想想！','没关系，换个角度试试看 🌱','深呼吸，结合提示再来一次 😊'];
const MSG_MISS = ['这一步有点难，我们一起看看解析 📖','没关系，弄懂比做对更重要！','记下这个小坑，下次就能轻松跨过 ✨','学会了就是赚到，继续加油！'];
function startQ(key, mode='normal', queue=null){
  const f = findQ(key); if(!f){ toast('找不到这道题'); return; }
  const isReview = mode==='review' || (D.review[key] && D.review[key].due<=today());
  S.session = { key, mode: isReview?'review':'normal', queue: queue||null, stepIdx:0, tries:0, results:[], elapsed:0, overtime:false, phase:'answer', fb:null, draft:'', sel:null, points:0, startedAt:Date.now() };
  go('play');
}
function vPlay(){
  const ss = S.session; if(!ss){ S.view='packs'; return vPacks(); }
  const f = findQ(ss.key); if(!f){ S.session=null; S.view='packs'; return vPacks(); }
  const {pack,q} = f; const n = q.steps.length;
  const qi = pack.questions.indexOf(q)+1;
  const head = `<div class="playhead"><button class="iconbtn" data-act="quit">‹</button>
    <div class="grow"><div style="font-weight:800;font-size:15px">${ss.mode==='review'?'🔁 巩固复习':'第 '+esc(qLabel(q,qi-1))+' 题'} ${ss.queue?`<span class="muted small">(${ss.queue.indexOf(ss.key)+1}/${ss.queue.length})</span>`:''}</div><div class="small muted">难度 ${diffStr(q.difficulty)}</div></div>
    <div class="timer" id="timer">⏱ <span id="tval">--:--</span></div></div>
    <div class="tbar" id="tbar"><i style="width:100%"></i></div>`;
  const curM = D.marks[ss.key];
  const markRow = `<div class="markrow"><span class="muted small">试卷初始结果</span><span class="grow"></span>${['ok','wrong','skip'].map(x=>`<button class="mpill ${curM===x?'on '+MARKS[x].cls:''}" data-act="setmark" data-k="${esc(ss.key)}" data-v="${x}">${MARKS[x].e} ${MARKS[x].n}</button>`).join('')}</div>`;
  const orig = `<div class="card orig"><div class="lab">原题 · ${q.knowledgePoints.map(esc).join(' · ')}</div>${tex(q.original)}${markRow}</div>`;
  const dots = `<div class="stepdots">${q.steps.map((s,i)=>`<i class="${ss.results[i]?ss.results[i].status:(i===ss.stepIdx&&ss.phase!=='done'?'cur':'')}"></i>`).join('')}</div>`;
  const done = ss.results.map((r,i)=> (i<ss.stepIdx || ss.phase==='done') ? `<div class="donestep"><span class="b" style="background:${r.status==='missed'?'var(--bad)':'var(--ok)'}">${r.status==='missed'?'!':'✓'}</span><div class="grow"><div class="muted small">第 ${i+1} 步</div>${tex(q.steps[i].prompt)}<div class="small" style="margin-top:4px">答案：<b>${tex(answerText(q.steps[i]))}</b></div></div></div>` : '').join('');
  if(ss.phase==='done') return head + orig + dots + vResult(q, ss) + `<details class="card"><summary style="font-weight:700;cursor:pointer">查看全部步骤</summary>${done}</details>`;
  const st = q.steps[ss.stepIdx];
  let input = '';
  const locked = ss.phase==='feedback';
  if(st.type==='choice'){
    const right = locked ? choiceIndex(st, st.answer) : -1;
    input = `<div class="opts">${st.options.map((o,i)=>{
      let cls = ss.sel===i?'sel':''; if(locked){ if(i===right) cls='right'; else if(ss.sel===i) cls='wrong'; }
      return `<button class="opt ${cls}" data-act="sel" data-v="${i}" ${locked?'disabled':''}><span class="k">${String.fromCharCode(65+i)}</span><span class="grow">${tex(o)}</span></button>`;}).join('')}</div>`;
  } else {
    input = `<input id="ans" class="ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" ${st.type==='number'?'inputmode="text"':''} placeholder="${st.type==='number'?'输入数字，可写分数如 3/4':'输入你的答案'}" value="${esc(ss.draft)}" ${locked?'disabled':''}>
    ${locked?'':`<div class="keys">${(st.type==='number'?['-','/','.','√']:['x','y','^2','+','-','(',')']).map(k=>`<button data-act="key" data-v="${esc(k)}">${k==='^2'?'x²':esc(k)}</button>`).join('')}</div>`}`;
  }
  let fb = '';
  if(ss.fb){
    const F = ss.fb;
    if(F.kind==='ok') fb = `<div class="fb ok pop"><b class="t">✅ ${esc(F.msg)} ${F.pts?`<span class="chip ok">+${F.pts} 积分</span>`:''}</b>${st.explanation?tex(st.explanation):''}</div>`;
    else if(F.kind==='wrong') fb = `<div class="fb bad pop"><b class="t">🤔 ${esc(F.msg)}</b>还有 1 次机会</div><div class="fb hint pop"><b class="t">💡 提示</b>${tex(st.hint)}</div>`;
    else if(F.kind==='miss') fb = `<div class="fb bad pop"><b class="t">🌱 ${esc(F.msg)}</b>正确答案：<b>${tex(answerText(st))}</b></div><div class="fb exp pop"><b class="t">📖 解析</b>${tex(st.explanation||'对照正确答案再想一想。')}</div>`;
  }
  const actions = locked
    ? `<button class="btn block ${ss.stepIdx===n-1?'ok':''}" data-act="next" style="margin-top:14px">${ss.stepIdx===n-1?'🏁 完成本题':'下一步 →'}</button>`
    : `<button class="btn block" data-act="submit" style="margin-top:14px">提交答案</button>`;
  return head + orig + dots + done + `<div class="card stepcard" id="stepcard"><span class="steplab">第 ${ss.stepIdx+1} / ${n} 步</span><div class="prompt">${tex(st.prompt)}</div>${input}${fb}${actions}</div>`;
}
function answerText(st){
  if(st.type==='choice'){ const i = choiceIndex(st, st.answer); return i>=0 ? String.fromCharCode(65+i)+'. '+st.options[i] : String(st.answer); }
  return String(st.answer);
}
function vResult(q, ss){
  const r = ss.result;
  const title = r.stars===3?'完美通关！':r.missed?'完成啦，收获满满！':r.overtime?'完成啦，下次再快一点！':'干得漂亮！';
  const sub = r.missed ? '这道题已加入「每日巩固」，过几天再来挑战它 💪' : r.overtime ? '已加入巩固，再做一次争取不超时 ⏱' : (r.reviewNote || '继续保持这个状态！');
  const nextKey = nextInFlow(ss);
  return `<div class="card result pop">
    <div class="bigstars">${'⭐'.repeat(r.stars)}<span class="off">${'⭐'.repeat(3-r.stars)}</span></div>
    <h2 style="margin:4px 0">${title}</h2><div class="muted small">${sub}</div>
    <div class="kv"><div><b>${r.stepsOk}/${r.stepsTotal}</b><span>步骤正确</span></div><div><b style="color:${r.overtime?'var(--bad)':'var(--ok)'}">${fmtTime(r.timeUsed)}</b><span>${r.overtime?'超时 ⏱':'限时内 ⚡'}</span></div><div><b>+${r.points}</b><span>积分</span></div></div>
    ${r.newBadges.length?`<div class="fb ok">🏅 获得新徽章：${r.newBadges.map(id=>{const b=BADGES.find(x=>x.id===id);return b.e+' '+b.n;}).join('、')}</div>`:''}
  </div>
  <div class="card"><h3>✅ 最终答案</h3><div>${tex(q.finalAnswer||'—')}</div></div>
  ${q.method?`<div class="card"><h3>🧭 解题思路</h3><div>${tex(q.method)}</div></div>`:''}
  ${q.formulas.length?`<div class="card"><h3>📐 用到的公式</h3>${q.formulas.map(fm=>`<div class="formula"><b>${esc(fm.name)}</b><div style="margin:4px 0;overflow-x:auto">${texBlock(fm.latex)}</div><div class="muted small">${tex(fm.tip)}</div></div>`).join('')}</div>`:''}
  <div class="row" style="gap:10px">
    <button class="btn ghost grow" data-act="retry">🔄 再做一次</button>
    ${nextKey?`<button class="btn grow" data-act="nextq" data-k="${esc(nextKey)}">下一题 →</button>`:`<button class="btn grow" data-act="backlist">${ss.mode==='review'?'完成巩固 🎉':'返回列表'}</button>`}
  </div>`;
}
function nextInFlow(ss){
  if(ss.queue){ const i = ss.queue.indexOf(ss.key); return ss.queue[i+1] || null; }
  const f = findQ(ss.key); if(!f) return null; const qs = f.pack.questions; const i = qs.indexOf(f.q);
  return qs[i+1] ? qk(f.pack.id, qs[i+1].id) : null;
}
function afterPlayMarkToast(m){ toast(isMiss(m) ? `已标记为 ${MARKS[m].e}${MARKS[m].n}，已计入薄弱项并加入今日巩固` : m ? '已标记为 ✅ 对' : '已清除初始标记'); }
let lastTick = 0;
function afterPlay(){
  updateTimer();
  const inp = $('#ans');
  if(inp && S.session.phase==='answer'){
    inp.addEventListener('input', e=>{ S.session.draft = e.target.value; });
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); act.submit(); } });
    if(window.matchMedia('(hover:hover)').matches) setTimeout(()=>inp.focus({preventScroll:true}),50);
  }
  const sc = $('#stepcard'); if(sc && S.session.fb){ if(S.session.fb.kind!=='ok') sc.classList.toggle('shake', S.session.fb.fresh); S.session.fb.fresh=false; setTimeout(()=>sc.scrollIntoView({behavior:'smooth',block:'nearest'}),30); }
}
function updateTimer(){
  const ss = S.session; if(!ss || S.view!=='play') return;
  const f = findQ(ss.key); if(!f) return;
  const lim = f.q.timeLimitSec, used = (ss.phase==='done' ? ss.result.timeUsed : ss.elapsed/1000);
  const el = $('#timer'), tv = $('#tval'), tb = $('#tbar'); if(!el) return;
  const left = lim - used;
  if(left>=0){ tv.textContent = fmtTime(left); el.className = 'timer'+(left<=lim*0.2?' low':''); tb.className='tbar'+(left<=lim*0.2?' low':''); tb.firstElementChild.style.width = (left/lim*100)+'%'; }
  else { tv.textContent = '超时 +'+fmtTime(-left); el.className='timer over'; tb.className='tbar over'; tb.firstElementChild.style.width='100%'; }
  if(ss.phase==='done') el.classList.remove('over');
}
setInterval(()=>{
  const now = Date.now(); const dt = lastTick ? Math.min(now-lastTick, 2000) : 0; lastTick = now;
  const ss = S.session;
  if(!ss || S.view!=='play' || ss.phase==='done' || document.hidden) return;
  ss.elapsed += dt;
  const f = findQ(ss.key); if(!f) return;
  if(!ss.overtime && ss.elapsed/1000 > f.q.timeLimitSec){ ss.overtime = true; toast('⏳ 时间到啦！不过别着急，慢慢把它做完'); }
  updateTimer();
}, 250);

function finishQ(){
  const ss = S.session; const {pack,q} = findQ(ss.key); const t = today();
  const stepsTotal = q.steps.length, missed = ss.results.filter(r=>r.status==='missed').length, stepsOk = stepsTotal - missed;
  const firstAll = ss.results.every(r=>r.status==='first');
  const timeUsed = Math.round(ss.elapsed/1000), overtime = ss.overtime || timeUsed > q.timeLimitSec;
  const stars = missed ? 1 : (firstAll && !overtime) ? 3 : 2;
  let pts = ss.points + 5; if(!overtime) pts += 20; if(stars===3) pts += 15;
  const wasDue = D.review[ss.key] && D.review[ss.key].due<=t;
  const mode = (ss.mode==='review' || wasDue) ? 'review' : 'normal';
  D.attempts.push({key:ss.key, packId:pack.id, qid:q.id, ts:Date.now(), date:t, kps:q.knowledgePoints.slice(), difficulty:q.difficulty, stepsTotal, stepsOk, missed, overtime, timeUsed, limit:q.timeLimitSec, stars, points:pts, mode});
  // 间隔复习
  let reviewNote = '';
  const prev = D.review[ss.key];
  if(missed || overtime){
    D.review[ss.key] = {level:0, due:addDays(t,INTERVALS[0]), count:(prev?prev.count:0)+1, reason: missed?'wrong':'overtime', added: prev?prev.added:t};
    D.hadReview = true;
  } else if(prev && prev.due<=t){
    const lv = prev.level+1;
    if(lv>=INTERVALS.length){ delete D.review[ss.key]; reviewNote = '🎓 这道题已经彻底掌握，移出巩固队列！'; }
    else { D.review[ss.key] = Object.assign({}, prev, {level:lv, due:addDays(t,INTERVALS[lv])}); reviewNote = `👍 巩固成功！下次复习：${INTERVALS[lv]} 天后`; }
  }
  // 每日记录
  const r = dayRec(t); r.questions++; r.points += pts;
  if(mode==='review'){ if(!r.reviewDone.includes(ss.key)) r.reviewDone.push(ss.key); }
  else if(!r.newDone.includes(ss.key)) r.newDone.push(ss.key);
  D.points += pts;
  let autoChk = false; if(!D.checkins[t]){ D.checkins[t] = Date.now(); autoChk = true; }
  const goalBefore = r.goalDone;
  const newBadges = checkBadges({stars, difficulty:q.difficulty, missed, timeUsed, limit:q.timeLimitSec});
  const g = goalInfo(); if(g.done && !goalBefore){ r.goalDone = true; }
  save();
  ss.result = {stars, missed, stepsOk, stepsTotal, overtime, timeUsed, points:pts, newBadges, reviewNote};
  ss.phase = 'done';
  render(); window.scrollTo({top:0, behavior:'smooth'});
  confetti(stars===3 ? 220 : 140);
  setTimeout(()=>{
    if(g.done && !goalBefore){ toast('🎯 今日目标达成！给自己鼓个掌 👏'); confetti(160); }
    else if(autoChk) toast(`🔥 已自动打卡，连续 ${streak()} 天！`);
  }, 900);
}

/* ========== 视图：每日巩固 ========== */
function vReview(){
  const due = dueKeys(); const t = today();
  const later = Object.entries(D.review).filter(([k,v])=>v.due>t && findQ(k)).sort((a,b)=>a[1].due.localeCompare(b[1].due));
  const r = dayRec();
  const item = (k, right) => { const f=findQ(k); const v=D.review[k];
    return `<div class="item"><div class="ic" style="background:${v.reason==='overtime'?'var(--warn-soft)':'var(--bad-soft)'}">${v.reason==='wrong'?'✗':v.reason==='initial'?'📝':'⏱'}</div>
    <div class="grow"><div class="tt small">${tex(f.q.original)}</div><div class="muted small">${f.q.knowledgePoints.map(esc).join('、')} · 第 ${v.level+1}/${INTERVALS.length} 轮 ${v.reason==='initial'?'· 试卷'+(MARKS[D.marks[k]]?MARKS[D.marks[k]].n:'错题'):''}</div></div>${right}</div>`; };
  return `<div class="topbar"><h1>🔁 每日巩固</h1></div>
  <div class="hero" style="background:linear-gradient(135deg,#ff9f43,#ff6b8b)">
    <div class="greet">今日待复习</div><div class="name" style="font-size:40px;margin:0">${due.length} <span style="font-size:16px">道</span></div>
    <div class="small" style="opacity:.92;position:relative;z-index:1">今天已复习 ${r.reviewDone.length} 道 · 间隔 1→2→4→7→15 天，答对且不超时就升级，失误则从头开始</div>
  </div>
  ${due.length?`<button class="btn block warn" style="margin:14px 0" data-act="startreview">▶ 开始今日巩固（${due.length} 道）</button>
    <div class="card list">${due.map(k=>item(k,`<button class="btn sm ghost" data-act="start" data-k="${esc(k)}" data-mode="review">做</button>`)).join('')}</div>`
  :`<div class="card empty"><div class="e">${Object.keys(D.review).length?'🌈':'🎈'}</div><b>今天没有要复习的题</b><div class="small">${Object.keys(D.review).length?'按计划，过几天再来巩固下面的题目吧':'做错或超时的题会自动出现在这里'}</div></div>`}
  ${later.length?`<div class="sec-title">📆 复习计划</div><div class="card list">${later.map(([k,v])=>item(k,`<span class="chip">${dayDiff(t,v.due)===1?'明天':dayDiff(t,v.due)+' 天后'}</span>`)).join('')}</div>`:''}`;
}

/* ========== 视图：公式速记 ========== */
function collectCards(){
  const fm = new Map(), methods = [];
  allPacks().forEach(p=>p.questions.forEach(q=>{
    q.formulas.forEach(f=>{ const id = f.name+'|'+f.latex; const c = fm.get(id) || {type:'f', id:'f'+hash(id), name:f.name, latex:f.latex, tip:f.tip, kps:new Set()}; q.knowledgePoints.forEach(k=>c.kps.add(k)); fm.set(id,c); });
    if(q.method) methods.push({type:'m', id:'m'+hash(p.id+q.id), name:stripTex(q.original).slice(0,40), original:q.original, method:q.method, kps:new Set(q.knowledgePoints)});
  }));

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function modal(html){ $('#modal').innerHTML = `<div class="mask" data-act="maskclose"><div class="sheet">${html}</div></div>`; }

function confetti(n=150){
  const c = document.createElement('canvas'); c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:70';
  const W = c.width = innerWidth*devicePixelRatio, H = c.height = innerHeight*devicePixelRatio; c.style.width='100%'; c.style.height='100%';
  document.body.appendChild(c); const x = c.getContext('2d');
  const cols = ['#6c5ce7','#4f8cff','#ff9f43','#ff6b8b','#14b88a','#ffc23d','#c06cf0'];
  const ps = Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*W*.022, vy:-Math.random()*H*.022-H*.006, s:(Math.random()*8+5)*devicePixelRatio, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:pick(cols), sh:Math.random()<.5}));
  const t0 = performance.now();
  (function f(t){
    x.clearRect(0,0,W,H); const age = (t-t0)/1000;
    ps.forEach(p=>{ p.vy += H*.0006; p.vx *= .99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-age/3); x.fillStyle=p.c;
      if(p.sh) x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); else { x.beginPath(); x.arc(0,0,p.s/3,0,7); x.fill(); } x.restore(); });
    if(age<3.2) requestAnimationFrame(f); else c.remove();
  })(t0);
}
function copyText(text){
  const fb = () => { const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok; };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(()=>toast('📋 已复制'),()=>toast(fb()?'📋 已复制':'复制失败，请手动选择文字复制')); }
  else toast(fb()?'📋 已复制':'复制失败，请手动选择文字复制');
}
function download(name, text){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ========== 交互 ========== */
const act = {
  tab(d){ if(S.view==='play' && S.session && S.session.phase==='done') S.session=null; go(d.v); },
  resume(){ go('play'); },
  openpack(d){ S.packId=d.v; go('pack'); },
  start(d){ if(!d.k){ go('packs'); return; } startQ(d.k, d.mode||'normal'); },
  startreview(){ const q = dueKeys(); if(q.length) startQ(q[0],'review',q); },
  quit(){ const ss=S.session; if(ss && ss.phase==='done'){ act.backlist(); return; } const f = ss && findQ(ss.key); S.view = ss&&ss.mode==='review'?'review':'pack'; if(f) S.packId=f.pack.id; S.tab = S.view==='review'?'review':'packs'; render(); toast('进度已保留，可随时回来继续'); },
  backlist(){ const ss=S.session; const f=ss&&findQ(ss.key); const rv = ss&&ss.mode==='review'; S.session=null; if(rv) go('review'); else { if(f) S.packId=f.pack.id; go('pack'); } },
  retry(){ const k=S.session.key; startQ(k, S.session.mode); },
  nextq(d){ const ss=S.session; startQ(d.k, ss.queue?'review':'normal', ss.queue); },
  sel(d){ const ss=S.session; if(ss.phase!=='answer') return; ss.sel=+d.v; document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('sel', i===ss.sel)); },
  key(d){ const inp=$('#ans'); if(!inp) return; const s=inp.selectionStart??inp.value.length, e=inp.selectionEnd??s; inp.value = inp.value.slice(0,s)+d.v+inp.value.slice(e); S.session.draft=inp.value; inp.focus(); const p=s+d.v.length; try{inp.setSelectionRange(p,p);}catch(_){} },
  submit(){
    const ss=S.session; if(!ss||ss.phase!=='answer') return; const {q} = findQ(ss.key); const st=q.steps[ss.stepIdx];
    let val; if(st.type==='choice'){ if(ss.sel===null){ toast('先选一个答案吧 😊'); return; } val=ss.sel; } else { val = ($('#ans')||{}).value||ss.draft; if(!norm(val)){ toast('先写下你的答案吧 ✍️'); return; } ss.draft=val; }
    if(checkAnswer(st,val)){
      const pts = ss.tries===0?10:5; ss.points+=pts; ss.results[ss.stepIdx]={status:ss.tries===0?'first':'second', tries:ss.tries};
      ss.phase='feedback'; ss.fb={kind:'ok', msg:pick(MSG_OK), pts, fresh:true};
    } else {
      ss.tries++;
      if(ss.tries>=2){ ss.results[ss.stepIdx]={status:'missed', tries:ss.tries}; ss.phase='feedback'; ss.fb={kind:'miss', msg:pick(MSG_MISS), fresh:true}; }
      else { ss.fb={kind:'wrong', msg:pick(MSG_WRONG), fresh:true}; if(st.type==='choice') ss.sel=null; }
    }
    render();
  },
  next(){ const ss=S.session; const {q}=findQ(ss.key); if(ss.stepIdx>=q.steps.length-1){ finishQ(); return; } ss.stepIdx++; ss.tries=0; ss.fb=null; ss.draft=''; ss.sel=null; ss.phase='answer'; render(); const sc=$('#stepcard'); if(sc) sc.scrollIntoView({behavior:'smooth',block:'center'}); },
  checkin(){ const t=today(); if(D.checkins[t]) return; D.checkins[t]=Date.now(); const nb=checkBadges(); save(); render(); confetti(90); toast(`🔥 打卡成功！已连续 ${streak()} 天`+(nb.length?' · 获得新徽章':'')); },
  import(){ importModal(); },
  copyprompt(){ copyText(AI_PROMPT); },
  doimport(){

    catch(e){ m.style.color='#d84848'; m.textContent='❌ '+e.message; }
  },
  delpack(d){ const bi = isBuiltinId(d.v); if(!confirm(bi?'恢复为内置版本吗？（做题记录和标记会保留）':'确定删除这个题包吗？（做题记录会保留）')) return; D.packs=D.packs.filter(p=>p.id!==d.v); if(!bi) Object.keys(D.review).forEach(k=>{ if(k.startsWith(d.v+'::')) delete D.review[k]; }); save(); go('packs'); toast('已删除'); },
  openmarks(d){ S.packId=d.v; go('marks'); },
  setmark(d){ const cur = D.marks[d.k]; const m = cur===d.v ? null : d.v; setMark(d.k, m); render(); if(S.view==='play') afterPlayMarkToast(m); },
  cyclemark(d){ const cur = D.marks[d.k]||null; const m = MARK_CYCLE[(MARK_CYCLE.indexOf(cur)+1)%MARK_CYCLE.length]; setMark(d.k, m); render(); },
  markrest(d){ const p = allPacks().find(x=>x.id===d.v); if(!p) return; p.questions.forEach(q=>{ const k=qk(p.id,q.id); if(!D.marks[k]) D.marks[k]='ok'; }); save(); render(); toast('✅ 已把未标记的题设为“对”'); },
  ftab(d){ S.fTab=d.v; render(); },

  export(){ const txt = JSON.stringify({app:'mathquest', version:1, exportedAt:new Date().toISOString(), data:D}, null, 2); download(`数学闯关岛备份-${today()}.json`, txt);
    modal(`<h2>⬇️ 导出备份</h2><div class="muted small">已尝试下载文件。如果手机上没有下载成功，可以复制下面的内容保存到备忘录。</div><textarea class="code" readonly style="margin-top:10px">${esc(txt)}</textarea><div class="row" style="gap:10px;margin-top:10px"><button class="btn ghost grow" data-act="copybk">📋 复制</button><button class="btn grow" data-act="close">完成</button></div>`); S._bk=txt; },
  copybk(){ copyText(S._bk||''); },
  importbk(){ modal(`<h2>⬆️ 导入备份</h2><div class="muted small" style="color:#d84848">导入会覆盖当前设备上的全部学习记录。</div><textarea class="code" id="bkText" placeholder="粘贴备份 JSON" style="margin-top:10px"></textarea><div class="row" style="margin-top:8px"><label class="btn sm ghost" style="cursor:pointer">📂 选择备份文件<input type="file" id="bkFile" accept=".json,.txt,application/json" hidden></label></div><div id="bkMsg" class="small" style="margin-top:8px;color:#d84848"></div><div class="row" style="gap:10px;margin-top:12px"><button class="btn ghost grow" data-act="close">取消</button><button class="btn grow" data-act="dobk">导入</button></div>`);

    catch(e){ $('#bkMsg').textContent='❌ '+e.message; } },
  reset(){ if(!confirm('确定清空所有学习数据吗？导入的题包、做题记录、徽章都会被删除。')) return; if(!confirm('真的确定吗？此操作无法撤销。')) return; localStorage.removeItem(KEY); load(); S.session=null; go('home'); toast('已清空，重新出发吧！'); },
  close(){ closeModal(); },
  maskclose(d,el,e){ if(e.target===el) closeModal(); }
};
